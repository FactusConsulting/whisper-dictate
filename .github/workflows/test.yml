name: tests

# Primary CI gate. Gives repository policy, doctests, Rust feature tests, and
# CLI smoke one owner each on every push to main and pull request. It is also
# invoked via workflow_call from release.yml so a tag never ships if any job
# fails.
#
# Required-status-check contexts (per the protected-branch ruleset — do NOT
# rename these job/matrix ids without updating the ruleset):
#   - unit                      (jobs.unit)
#   - lint-workflows            (jobs.lint-workflows)
#   - smoke (ubuntu-latest)     (jobs.smoke matrix)
#   - smoke (windows-2025)      (jobs.smoke matrix)
#   - rust  (ubuntu-latest)     (jobs.rust  matrix — aggregator over rust-features)
#   - rust  (windows-2025)      (jobs.rust  matrix — aggregator over rust-features)
# The groq-integration and rust-features / rust-release jobs are NOT required
# themselves — rust-features is what the required `rust` aggregator gates on;
# rust-release runs on push-to-main and workflow_call (release) only and
# never in PR CI (release-profile compile is ~10 min extra per push).

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:        # allow other workflows (e.g. release) to run the full suite as a gate
    inputs:
      ref:
        description: Git ref to check out for all jobs. Defaults to the triggering ref; the release passes the tag so manual re-releases gate on the shipped commit.
        type: string
        required: false
        default: ''

# Cancel superseded runs on the same PR only. Non-PR events (main pushes, the
# release gate via workflow_call) get a unique group so they're never cancelled
# OR serialized/queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  NEXUS_DOCKER_MIRROR: ${{ vars.NEXUS_DOCKER_MIRROR }}

jobs:
  # Compute which categories of files changed so the heavy jobs (Rust matrix,
  # native smoke, integration) can skip themselves while the focused
  # repository-policy job still runs for documentation and policy surfaces.
  # On push to main / workflow_call every output defaults to true; filtering is
  # PR-scoped only.
  #
  # Required-status-check semantics:
  # - Matrix jobs (`smoke`, `rust`) gate via STEP-LEVEL `if:` so the matrix
  #   still expands and emits each required context name (`rust (ubuntu-latest)`,
  #   `smoke (windows-2025)`, ...). A job-level `if:` would skip BEFORE the
  #   matrix expanded, never creating the required check contexts and
  #   leaving branch protection waiting forever (P2 #398 finding 2).
  changes:
    # `dorny/paths-filter` reads the PR's changed-files list via the GitHub
    # API, which needs `pull-requests: read`. Restricted-token repos default
    # to less than that, so spell it out (P2 #398 finding 3).
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      # On workflow_call from a tag release there is no changed-files range,
      # and every gate must run. Pull requests use the API-backed filter;
      # pushes use paths-filter's before/after comparison. Product and policy
      # outputs still default to true outside PRs, while audit retains its
      # path result on main so a dependency push launches it exactly once.
      # Before this fallback the release pipeline startup-failed on tag
      # push: the filter step would have nothing to diff against and the
      # downstream `Fail required check` step would fire (P0 follow-up to
      # #398 surfaced by the v1.19.0-rc.1 release attempt).
      # Repository-policy tests inspect the native package, docs and workflows;
      # they are not product runtime code.
      rust: ${{ github.event_name == 'pull_request' && steps.filter.outputs.rust || 'true' }}
      repo_tests: ${{ github.event_name == 'pull_request' && steps.filter.outputs.repo_tests || 'true' }}
      ci_image: ${{ github.event_name == 'pull_request' && steps.filter.outputs.ci_image || 'true' }}
      audit: ${{ github.event_name == 'workflow_call' && 'true' || steps.filter.outputs.audit || 'false' }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name != 'workflow_call'
        with:
          ref: ${{ inputs.ref }}
      # Pin to v4.0.1 (Node 24) — GitHub started defaulting JavaScript
      # actions to Node 24 on June 16, 2026 and the Node 20 runtime is
      # scheduled for removal later in 2026. A Node-20-targeted action
      # could brick the `changes` job once the transition lands, which
      # would skip every required check downstream — P2 #398 follow-up.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        # PRs use the changed-files API; pushes use their before/after range.
        # A release workflow_call skips filtering and runs every gate.
        if: github.event_name != 'workflow_call'
        with:
          filters: |
            # `rust` = touches Rust sources OR shared config a Rust build
            # consumes (schemas, sonar config) OR any workflow YAML (a
            # workflow change must exercise the full matrix). Docker
            # image files are here too because the container leg builds
            # the CI image on-demand from docker/ci-ubuntu2604/.
            rust:
              - 'src/rust/**'
              - 'rust-toolchain.toml'
              - 'sonar-project.properties'
              - 'shared/config/**'
              - 'scripts/**'
              - 'docker/**'
              - 'packaging/**'
              - 'nix/**'
              - '.github/workflows/**'
            # Repository-policy tests inspect packaging, docs, schemas,
            # scripts and workflows through native Rust integration tests.
            repo_tests:
              - 'AGENTS.md'
              - '*.md'
              - 'docs/**'
              - 'src/rust/**'
              - 'rust-toolchain.toml'
              - 'shared/config/**'
              - 'scripts/**'
              - 'sonar-project.properties'
              - 'docker/**'
              - '.github/workflows/**'
              - 'packaging/**'
              - 'nix/**'
              # The repository-policy tests scan Rust diffs for missing
              # coverage and generated-doc updates.
            ci_image:
              - 'docker/ci-ubuntu2604/**'
            # Dependency-relevant PRs and main pushes call the reusable audit once.
            # test.yml itself is included so changes to this gate exercise it.
            audit:
              - 'src/rust/Cargo.toml'
              - 'src/rust/Cargo.lock'
              - '.cargo/audit.toml'
              - '.github/workflows/cargo-audit.yml'
              - '.github/workflows/test.yml'

  dependency-audit:
    needs: changes
    if: ${{ needs.changes.outputs.audit == 'true' }}
    uses: ./.github/workflows/cargo-audit.yml
    with:
      ref: ${{ inputs.ref }}

  unit:
    needs: [changes, dependency-audit]
    # `if: !cancelled()` (not the default dependency-success gate) means a
    # `changes` failure does not silently SKIP this required check — branch protection would
    # then let a code PR merge without tests because skipped checks count
    # as success here (P1 #398 follow-up). The first step explicitly
    # fails if `changes` did not succeed; subsequent steps gate on the
    # `repo_tests` output so documentation and policy-only changes retain
    # repository-policy coverage without running the full Rust suite here.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      RUN_UNIT: ${{ needs.changes.result == 'success' && (needs.changes.outputs.repo_tests == 'true' || github.event_name != 'pull_request') }}
    steps:
      - name: Fail required check if change detection broke
        if: needs.changes.result != 'success'
        run: |
          echo "::error::changes job did not succeed (result=${{ needs.changes.result }}); failing required \`unit\` check to avoid silently skipping tests on a code PR"
          exit 1
      - name: Fail required check if dependency audit did not succeed
        if: >-
          needs.changes.result == 'success'
          && needs.changes.outputs.audit == 'true'
          && needs.dependency-audit.result != 'success'
        run: |
          echo "::error::dependency audit did not succeed (result=${{ needs.dependency-audit.result }}); failing required \`unit\` check"
          exit 1
      - if: env.RUN_UNIT != 'true'
        run: echo "::notice::no repository-policy changes detected — skipping focused policy and doctest checks"
      - uses: actions/checkout@v6
        if: env.RUN_UNIT == 'true'
        with:
          ref: ${{ inputs.ref }}
          # Native repository-policy tests compare against origin/main, so
          # fetch the base ref instead of the checkout default depth=1.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        if: env.RUN_UNIT == 'true'
      - name: Install native Linux build dependencies
        if: env.RUN_UNIT == 'true' && runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: pkg-config libdbus-1-dev libwayland-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxi-dev libxtst-dev libasound2-dev
          version: 1.0
      - name: Run repository-policy tests and doctests
        if: env.RUN_UNIT == 'true'
        run: |
          cargo test --manifest-path src/rust/Cargo.toml --locked -p whisper-dictate-app --test repository_policy
          cargo test --manifest-path src/rust/Cargo.toml --locked -p whisper-dictate-app --doc

  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Resolve actionlint image via Nexus mirror
        id: actionlint_image
        run: |
          set -eu
          upstream_image="rhysd/actionlint:1.7.12"
          mirror_image="${NEXUS_DOCKER_MIRROR:+$NEXUS_DOCKER_MIRROR/$upstream_image}"
          if [ -n "$mirror_image" ] && docker pull "$mirror_image"; then
            echo "image=$mirror_image" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$mirror_image" ]; then
              echo "::notice::Nexus mirror miss for ${mirror_image}; falling back to ${upstream_image}"
            fi
            if docker pull "$upstream_image"; then
              echo "image=$upstream_image" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Failed to pull ${upstream_image} from Docker Hub."
              exit 1
            fi
          fi
      - name: actionlint
        run: docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace "${{ steps.actionlint_image.outputs.image }}" -color

  smoke:
    # Native CLI sanity: --help and --version must stay headless and cheap.
    #
    # Job-level `if:` would skip BEFORE the matrix expanded and the
    # required `smoke (ubuntu-latest)` / `smoke (windows-2025)` contexts
    # would never be emitted — branch protection would hang. Step-level
    # `if:` keeps the matrix legs running and each step short-circuits
    # to a no-op on docs-only PRs. P2 #398 finding 2.
    #
    # `if: !cancelled()` (P1 #398 follow-up) so a `changes` failure does
    # NOT silently skip these required matrix legs. The first step then
    # explicitly fails if `changes` did not succeed.
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      RUN_SMOKE: ${{ needs.changes.result == 'success' && (needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request') }}
    steps:
      - name: Fail required check if change detection broke
        if: needs.changes.result != 'success'
        run: |
          echo "::error::changes job did not succeed (result=${{ needs.changes.result }}); failing required \`smoke\` matrix leg to avoid silently skipping tests on a code PR"
          exit 1
      - if: env.RUN_SMOKE != 'true'
        run: echo "::notice::Skipping smoke matrix leg — no code changes detected"
      - uses: actions/checkout@v6
        if: env.RUN_SMOKE == 'true'
        with:
          ref: ${{ inputs.ref }}
      - name: Install native Linux build dependencies
        if: env.RUN_SMOKE == 'true' && runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: pkg-config libdbus-1-dev libwayland-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxi-dev libxtst-dev libasound2-dev
          version: 1.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        if: env.RUN_SMOKE == 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.RUN_SMOKE == 'true'
        with:
          workspaces: "src/rust -> target"
          shared-key: "rust-smoke-${{ matrix.os }}"
      - name: Native CLI --help
        if: env.RUN_SMOKE == 'true'
        run: cargo run --locked --manifest-path src/rust/Cargo.toml -- --help
      - name: Native CLI --version
        if: env.RUN_SMOKE == 'true'
        run: cargo run --locked --manifest-path src/rust/Cargo.toml -- --version
      - name: Native CLI config path
        if: env.RUN_SMOKE == 'true'
        run: cargo run --locked --manifest-path src/rust/Cargo.toml -- config path

  # ---------------------------------------------------------------------------
  # rust-features: parallelises the previously sequential fmt / clippy / test
  # legs. Each cargo invocation runs in its own matrix cell so Cargo's
  # per-feature fingerprint no longer discards artifacts between successive
  # steps sharing one job. Split designed after wall-clock analysis: the old
  # single-job rust leg hit ~18 min on Windows because every feature flip
  # recompiled the crate + affected deps; per-leg cells push that toward the
  # slowest single build (~6-8 min).
  #
  # NOT required by branch protection itself — the `rust` aggregator below
  # keeps the `rust (ubuntu-latest)` / `rust (windows-2025)` context names.
  # Change here freely; only touch the aggregator when renaming contexts.
  # ---------------------------------------------------------------------------
  rust-features:
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
        # Each profile owns ONE cargo invocation. `feature_arg` is the
        # verbatim cargo flag (empty for the default feature set); `role`
        # selects test vs clippy in the step gates below. Keep the
        # feature-gated cells STANDALONE (not merged): cargo features
        # are additive, so code gated on one feature can accidentally
        # reference an item only present under another; a combined-only
        # test would compile while the standalone case breaks for users
        # who enable that one feature alone (Codex P2 #585).
        profile:
          - id: base
            feature_arg: ""
            role: test
          - id: hotkeys
            feature_arg: "--features rust-hotkeys"
            role: test
          - id: audio
            feature_arg: "--features audio-capture"
            role: test
          # The in-process resume path (`in_process::resume_key_names_from_env`)
          # is `cfg(all(rust-hotkeys, rust-injection))`, so the dead-manager
          # regression tests that guard the Windows PTT fallback wedge
          # (#668 discussion 3664983412) compile in NEITHER the standalone
          # `hotkeys` cell nor `audio`. Without this pair cell they would run
          # in no `cargo test` invocation at all -- Codex P2 #679 cmt
          # 3667235634. Added alongside, not instead of, the standalone
          # cells, so the one-feature-alone breakage the comment above
          # warns about stays covered.
          - id: hotkeys-injection
            feature_arg: "--features rust-hotkeys,rust-injection"
            role: test
          # The native dictation session is gated on whisper-rs-local +
          # audio-capture + rust-injection. Keep this combination explicit so
          # its auto-injection dispatch and clipboard-fallback tests run on
          # Windows and Linux.
          - id: local-injection
            feature_arg: "--features whisper-rs-local,audio-capture,rust-injection"
            role: test
          # Exact normal package profile. This runs on Linux and Windows so the
          # supported artifact feature surface is tested before release.
          - id: shipping
            feature_arg: "--no-default-features --features shipping"
            role: test
          - id: clippy-glow
            feature_arg: "--features ui-egui-glow"
            role: clippy
    runs-on: ${{ matrix.os }}
    env:
      # `rust` output is the per-language gate (2026-07-26 #590 follow-up):
      # a docs/config-only PR that doesn't touch Rust sources, workflow YAML,
      # shared config or scripts skips the whole rust matrix (~5-15 min
      # of wall-clock on Windows). Non-PR events always run.
      RUN_RUST: ${{ needs.changes.result == 'success' && (needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request') }}
    steps:
      - name: Fail matrix leg if change detection broke
        if: needs.changes.result != 'success'
        run: |
          echo "::error::changes job did not succeed (result=${{ needs.changes.result }}); failing rust-features leg so the required \`rust\` aggregator fails too"
          exit 1
      - if: env.RUN_RUST != 'true'
        run: echo "::notice::Skipping rust-features leg (${{ matrix.profile.id }}) — no Rust-relevant changes detected"
      - uses: actions/checkout@v6
        if: env.RUN_RUST == 'true'
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Install Linux Rust UI build deps (cached)
        # awalsh128/cache-apt-pkgs-action wraps apt install + actions/cache
        # so the 12-package install is a ~5s cache read on subsequent runs
        # instead of ~30-40s of apt work every time. First-run cost is
        # unchanged; the win is on every PR push after the initial one.
        if: env.RUN_RUST == 'true' && runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: pkg-config libdbus-1-dev libwayland-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxi-dev libxtst-dev libasound2-dev
          version: 1.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        if: env.RUN_RUST == 'true'
        with:
          # Every leg installs clippy; only the clippy-role cell runs it.
          # The extra component costs a few seconds and keeps
          # the toolchain-component policy check happy.
          components: clippy
      - name: Install cargo-nextest
        if: env.RUN_RUST == 'true' && matrix.profile.role == 'test'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        if: env.RUN_RUST == 'true'
        with:
          # Per-profile key: parallel cells all try to save under the
          # same key otherwise, but actions/cache is immutable-key —
          # only the first upload wins. Every cell then restores THAT
          # winning cell's target/, not its own, so its cargo re-does
          # feature-specific compilation on every warm run (Codex P2
          # #585). Per-profile keys give each cell a 100% cache hit for
          # its exact feature-set.
          workspaces: "src/rust -> ../target"
          key: ${{ matrix.profile.id }}
      - name: Rust format
        # fmt is OS- and feature-independent, so run it exactly once (in
        # the ubuntu `base` cell) instead of on every matrix leg.
        if: env.RUN_RUST == 'true' && matrix.profile.id == 'base' && runner.os == 'Linux'
        run: cargo fmt --manifest-path src/rust/Cargo.toml --all -- --check
      - name: Rust Clippy
        # Everyday CI is glow-only (our shipping renderer) so it stays fast and
        # off the wgpu/DX12 stack. The wgpu exit route is build-validated
        # separately by the periodic renderer-matrix workflow. Hardcoded
        # feature set so the release-workflow test's literal string check
        # keeps working — the `clippy-glow` profile is the only clippy cell,
        # so no template needed.
        if: env.RUN_RUST == 'true' && matrix.profile.role == 'clippy'
        run: cargo clippy --manifest-path src/rust/Cargo.toml --target-dir target -p whisper-dictate-app --all-targets --features ui-egui-glow -- -D warnings
      - name: Rust tests
        # Runs against the profile's specific feature set. Empty
        # `feature_arg` → default features. The rust-hotkeys and
        # audio-capture cells cover their respective backends
        # (rdev/enigo, cpal/rubato); base covers the default
        # feature intersection.
        if: env.RUN_RUST == 'true' && matrix.profile.role == 'test'
        run: cargo nextest run --manifest-path src/rust/Cargo.toml --locked --target-dir target -p whisper-dictate-app --profile ci -E 'not(binary(=repository_policy))' ${{ matrix.profile.feature_arg }}
  # ---------------------------------------------------------------------------
  # rust: required-status aggregator. Retains the `rust (ubuntu-latest)` and
  # `rust (windows-2025)` context names that the protected-branch ruleset
  # requires. After the 2026-07-26 split this job no longer runs cargo — it
  # aggregates the `rust-features` matrix into the two required contexts so
  # branch protection sees one green check per OS regardless of how many
  # feature cells the matrix expands to. Do NOT rename these matrix legs;
  # branch protection reads the context names verbatim.
  # ---------------------------------------------------------------------------
  rust:
    needs: [changes, rust-features, rust-release]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ubuntu-latest
    steps:
      - name: Fail required check if change detection broke
        if: needs.changes.result != 'success'
        run: |
          echo "::error::changes job did not succeed (result=${{ needs.changes.result }}); failing required \`rust (${{ matrix.os }})\` check"
          exit 1
      - name: Fail required check if rust-features matrix did not succeed
        # `skipped` is fine — that's the docs-only-PR path where every leg
        # short-circuited. Anything else (failure, cancelled) MUST bubble
        # up to the required aggregator.
        if: needs.rust-features.result != 'success' && needs.rust-features.result != 'skipped'
        run: |
          echo "::error::rust-features matrix did not succeed (result=${{ needs.rust-features.result }}); failing required \`rust (${{ matrix.os }})\` check"
          exit 1
      - name: Fail required check if rust-release matrix did not succeed
        # Codex P2 #581: the Windows release CLI-output smoke (#564) and
        # injection-idempotency (Codex #518 F6) live in rust-release and
        # would otherwise NOT gate the required check — a red
        # `rust-release (windows-2025)` on a PR would still let the
        # aggregator go green and the regression could merge. Gating on
        # rust-release.result closes that gap. `skipped` is fine (docs-only PR).
        if: needs.rust-release.result != 'success' && needs.rust-release.result != 'skipped'
        run: |
          echo "::error::rust-release matrix did not succeed (result=${{ needs.rust-release.result }}); failing required \`rust (${{ matrix.os }})\` check to prevent a Windows regression from merging under a green required context"
          exit 1
      - run: echo "rust aggregator OK for ${{ matrix.os }} — rust-features + rust-release passed"

  # ---------------------------------------------------------------------------
  # rust-release: release-profile builds + release-mode regression smokes.
  #
  # Split coverage by OS to keep Windows-specific regression guards on PR CI
  # while still shedding the Linux release compile from PR turnaround:
  #   - windows-2025: runs on EVERY event (PR + push + workflow_call). The
  #     Windows release CLI-output smoke (#564 windows_subsystem bug) and
  #     injection-idempotency (Codex #518 F6 SendInput leakage) are both
  #     Windows-specific and have no equivalent elsewhere in this workflow;
  #     `integration-ubuntu-2604` is Linux-only, so it cannot cover them.
  #     Removing them from PR CI would let a regression merge and only
  #     surface on the post-merge push (Claude-bot review PR #581).
  #   - ubuntu-latest: runs on push-to-main and workflow_call only. The
  #     Linux release build is a link-surface smoke (whisper-rs API compat)
  #     with no unique behavioural guard, and the release pipeline gates
  #     on it via workflow_call before shipping — so PR CI saves ~10 min
  #     without losing pre-ship coverage.
  # ---------------------------------------------------------------------------
  rust-release:
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      # RUN_RELEASE=false when (a) `changes` failed, (b) docs-only PR, OR
      # (c) this is the ubuntu leg on a pull_request (Linux release build
      # is push/workflow_call only per the header comment above), OR
      # (d) the PR touches no Rust-relevant paths at all (a docs-only
      # PR doesn't need the Windows regression guards to fire because
      # there's no Rust code to regress — 2026-07-26 #590 follow-up).
      # The Windows leg still gets RUN_RELEASE=true on any Rust-touching
      # PR so the #564 and #518 F6 regression guards keep firing pre-merge.
      RUN_RELEASE: >-
        ${{ needs.changes.result == 'success'
            && (needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request')
            && (matrix.os == 'windows-2025' || github.event_name != 'pull_request') }}
    steps:
      - name: Fail check if change detection broke
        if: needs.changes.result != 'success'
        run: |
          echo "::error::changes job did not succeed (result=${{ needs.changes.result }}); failing rust-release leg"
          exit 1
      - if: env.RUN_RELEASE != 'true'
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::notice::Skipping rust-release (ubuntu-latest) — Linux release build is push/workflow_call only"
          else
            echo "::notice::Skipping rust-release leg — no code changes detected"
          fi
        shell: bash
      - uses: actions/checkout@v6
        if: env.RUN_RELEASE == 'true'
        with:
          ref: ${{ inputs.ref }}
      - name: Install Linux Rust UI build deps (cached)
        # Same apt-cache action as rust-features — the two jobs pin the
        # same package list, so a hit on either warms both.
        if: env.RUN_RELEASE == 'true' && runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: pkg-config libdbus-1-dev libwayland-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxi-dev libxtst-dev libasound2-dev
          version: 1.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        if: env.RUN_RELEASE == 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.RUN_RELEASE == 'true'
        with:
          workspaces: "src/rust -> ../target"
          # Release profile compiles into its own target sub-tree; keep
          # its cache separate from the PR-CI debug caches above.
          key: release
      - name: Rust build (exact shipping profile)
        # rc.2 of Wave 8 (#348): the `whisper-rs-local` feature compiles
        # whisper.cpp from source via whisper-rs and is now shipping in
        # the release installer. Build-only (not `cargo test`) because
        # whisper-rs's own integration tests want a GGML model fixture
        # we don't ship; this step just confirms the C++/Rust link
        # boundary still compiles on both runners. Without this gate the
        # release pipeline (which builds `--features ...,whisper-rs-local`)
        # would be the first place a whisper-rs API break surfaces, and
        # that's too late.
        #
        # `audio-capture` is included alongside so the release binary
        # produced here carries the `self-test audio-capture` / `dictate-mic`
        # verbs the next step's smoke asserts on. Same release-profile
        # target-dir, so no extra compile — the feature just brings in
        # cpal + rubato to the same artifact.
        if: env.RUN_RELEASE == 'true'
        run: cargo build --manifest-path src/rust/Cargo.toml --target-dir target -p whisper-dictate-app --bins --no-default-features --features shipping --release
      - name: Windows release CLI-output smoke
        # Regression guard for the `windows_subsystem = "windows"` bug class
        # (PR #564): a GUI-subsystem release binary has no console attached,
        # so every CLI verb silently discarded its stdout when a user ran
        # it from PowerShell. Debug builds hide this — the attribute is
        # gated on `not(debug_assertions)` — so only a RELEASE binary check
        # catches it. Reuses the release exe built by the step above (no
        # extra compile). Windows-only because the bug is a Windows PE
        # subsystem attribute.
        #
        # Two orthogonal checks:
        #
        #  1) PE Optional Header Subsystem field (the definitive guard).
        #     GUI subsystem = 2 (IMAGE_SUBSYSTEM_WINDOWS_GUI); console = 3
        #     (IMAGE_SUBSYSTEM_WINDOWS_CUI). Read directly from the binary
        #     because a redirected `& $exe` in PowerShell gives GUI-subsystem
        #     processes an explicit stdout pipe handle — so a content-only
        #     check tautologically passes for the exact binary this guard
        #     is meant to reject (Codex #565 P1). Inspecting the PE header
        #     is bit-exact — it cannot be gamed by shell redirection.
        #     Layout: DOS header e_lfanew (UInt32 at 0x3C) → PE signature →
        #     COFF header (24 bytes) → Optional Header; Subsystem is a
        #     UInt16 at offset 68 (0x44) within the Optional Header, i.e.
        #     e_lfanew + 24 + 68 = e_lfanew + 0x5C in the file.
        #
        #  2) Content smokes on top: `config path` (headless-safe, exit 0,
        #     prints a path) + `self-test audio-capture --json` (audio verb
        #     reaches cpal and prints its JSON envelope BEFORE the exit
        #     decision — so a healthy binary still produces JSON on a
        #     mic-less CI runner). Catches missing verbs, panics on
        #     first-frame init, and other "the binary is broken in a way
        #     other than the subsystem attr" regressions.
        #
        # `pwsh` propagates $LASTEXITCODE from the last native call, and
        # `self-test audio-capture` exits non-zero without a mic on the
        # runner. Force `exit 0` after both content checks pass so the
        # environmental exit code does not shadow the smoke's real result.
        if: env.RUN_RELEASE == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "target/release/wd.exe"
          $guiExe = "target/release/wd-gui.exe"

          function Assert-PeSubsystem([string] $path, [UInt16] $expected, [string] $name) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $peOffset = [System.BitConverter]::ToUInt32($bytes, 0x3C)
            $subsystem = [System.BitConverter]::ToUInt16($bytes, $peOffset + 0x5C)
            if ($subsystem -ne $expected) {
              throw "$name PE subsystem is $subsystem (expected $expected)."
            }
          }

          Assert-PeSubsystem $exe 3 'wd.exe'
          Assert-PeSubsystem $guiExe 2 'wd-gui.exe'
          Write-Host "release PE subsystem checks passed"

          # (2) Content smokes — catch missing verbs / init panics.
          $out = & $exe config path
          if ([string]::IsNullOrWhiteSpace($out)) {
            throw "release CLI produced NO stdout for 'config path' — CLI dispatch is broken (see PR #564)"
          }
          Write-Host "release CLI stdout OK: $out"
          $st = & $exe self-test audio-capture --json --duration-ms 200
          if ([string]::IsNullOrWhiteSpace($st)) {
            throw "release CLI produced NO stdout for 'self-test audio-capture --json' — audio verb dispatch is broken"
          }
          # Assert the STABLE `kind` field on the JSON envelope, not just
          # non-empty output — a truncated JSON or a stray diagnostic line
          # would pass a bare IsNullOrWhiteSpace check and mask a real
          # output regression (Codex #565 P2). `kind` is present regardless
          # of whether the capture itself succeeded, so this survives the
          # headless "no mic" runner exit-non-zero case too.
          try {
            $doc = $st | ConvertFrom-Json -ErrorAction Stop
          } catch {
            throw "release CLI 'self-test audio-capture --json' emitted non-JSON stdout — audio verb JSON envelope regression: $_ / raw stdout: $st"
          }
          if ($doc.kind -ne 'audio_capture_self_test') {
            throw "release CLI 'self-test audio-capture --json' returned kind='$($doc.kind)' (expected 'audio_capture_self_test') — envelope contract regression"
          }
          Write-Host "audio-capture self-test JSON envelope OK (kind=audio_capture_self_test, succeeded=$($doc.succeeded))"

          # Discard the audio verb's environmental non-zero exit (no mic on
          # the runner) — the real outcome is what we asserted above.
          exit 0
      - name: injection-idempotency regression test (self-test)
        # Codex #518 F6: the ubuntu 26.04 integration job runs this same
        # verb on Linux (see `integration-ubuntu-2604` below), but the
        # bug class this catches — modifier state leakage on the
        # SendInput path — is *Windows*-specific. Running the harness on
        # both matrix legs (ubuntu-latest + windows-2025) exercises the
        # `enigo` backend on the Windows runner where a stuck-Shift
        # regression would actually surface.
        #
        # Default dry-run: no OS side effects on either matrix leg, so
        # this is safe under `-D warnings` alongside every other rust
        # step. NO `|| true` — a real regression here MUST fail CI.
        # PR CI does NOT run this (release-profile compile is expensive);
        # PR-time coverage lives in `integration-ubuntu-2604` which runs
        # the same self-test verb on the ubuntu 26.04 container leg.
        if: env.RUN_RELEASE == 'true'
        run: cargo run --release --manifest-path src/rust/Cargo.toml --target-dir target -p whisper-dictate-app --features rust-hotkeys,rust-injection -- self-test injection-idempotency --iterations 10 --json

  integration-ubuntu-2604:
    # Runs the Rust test suites inside a purpose-built Ubuntu
    # 26.04 container (docker/ci-ubuntu2604/Dockerfile) so we get one
    # environment that matches what users will be on when 26.04 becomes
    # the default LTS. NOT a required check yet — informational until we
    # have a few green runs. To promote to required: add
    # `integration-ubuntu-2604` to the protected-branch ruleset and add
    # this line to the required-status list header comment at the top of
    # this file.
    #
    # Bootstrap-friendly image resolution: `docker pull` first (fast when
    # `.github/workflows/build-ci-images.yml` has published the image on
    # a prior merge), fall back to `docker build` when the tag doesn't
    # exist yet. This keeps the very first PR (which introduces the
    # container) exercising the same Dockerfile it will publish once
    # merged, without a chicken-and-egg on the registry.
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      # The container owns Ubuntu 26.04 runtime compatibility. Repository
      # policy and doctests are owned by `unit`, so docs/policy-only changes do
      # not start this heavyweight environment suite. Workflow and packaging
      # changes remain in the `rust` filter and still exercise it.
      RUN_INTEG: ${{ needs.changes.result == 'success' && (needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request') }}
      FORCE_IMAGE_BUILD: ${{ github.event_name == 'pull_request' && needs.changes.outputs.ci_image == 'true' }}
      IMAGE: ghcr.io/factusconsulting/whisper-dictate-ci-ubuntu2604:latest
    steps:
      - name: Skip on docs-only PRs
        if: env.RUN_INTEG != 'true'
        run: echo "::notice::Skipping ubuntu 26.04 integration — no code changes detected"
      - uses: actions/checkout@v6
        if: env.RUN_INTEG == 'true'
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Log in to GHCR (pull only)
        if: env.RUN_INTEG == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve container image (pull or build)
        if: env.RUN_INTEG == 'true'
        run: |
          set -euxo pipefail
          build_image() {
            upstream_base="ubuntu:26.04"
            base_image="$upstream_base"
            mirror_base="${NEXUS_DOCKER_MIRROR:+$NEXUS_DOCKER_MIRROR/library/ubuntu:26.04}"
            if [ -n "$mirror_base" ] && docker pull "$mirror_base"; then
              base_image="$mirror_base"
            elif [ -n "$mirror_base" ]; then
              echo "::notice::Nexus mirror miss for ${mirror_base}; using ${upstream_base}"
            fi
            docker build --build-arg CI_BASE_IMAGE="$base_image" -t "$IMAGE" docker/ci-ubuntu2604/
          }
          if [ "$FORCE_IMAGE_BUILD" = 'true' ]; then
            echo "Dockerfile changed; building the CI image from this PR before testing"
            build_image
          elif docker pull "$IMAGE"; then
            echo "using published image"
          else
            echo "image not yet published, building inline from docker/ci-ubuntu2604/"
            build_image
          fi
      - name: Rust tests except repository policy inside container
        if: env.RUN_INTEG == 'true'
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace "$IMAGE" \
            bash -c '
              test_args=()
              for test_file in src/rust/tests/*.rs; do
                test_name="${test_file##*/}"
                test_name="${test_name%.rs}"
                if [ "$test_name" != repository_policy ]; then
                  test_args+=(--test "$test_name")
                fi
              done
              cargo test --manifest-path src/rust/Cargo.toml --target-dir target \
                -p whisper-dictate-app --lib --bins "${test_args[@]}"
            '
      - name: CLI smoke (models list) inside container
        if: env.RUN_INTEG == 'true'
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace "$IMAGE" \
            bash -c "cargo run --release --manifest-path src/rust/Cargo.toml --target-dir target -p whisper-dictate-app -- models list"
      - name: PTT-wedge regression test (self-test)
        # Regression coverage for the v1.20.7 (Windows) / v1.20.2 (Wayland,
        # #467) push-to-talk wedge class of bugs — the headless harness added
        # in #510 exercises the shared `hotkey::inject_guard` + tracker filter
        # both drivers converge on, with a burst of synthetic self-injected
        # events representative of the v1.20.7 wedge. Feature-gated behind
        # `rust-hotkeys,rust-injection`; the Ubuntu 26.04 CI image bakes in
        # every dep both features need (rdev via libxi-dev/libxtst-dev,
        # evdev is pure-Rust, enigo pulls only crates already covered).
        # NO `|| true` — a real regression here MUST fail CI. Iteration
        # count intentionally >=5 so intermittent races cannot slip past.
        if: env.RUN_INTEG == 'true'
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace "$IMAGE" \
            bash -c "cargo run --release --manifest-path src/rust/Cargo.toml --target-dir target -p whisper-dictate-app --features rust-hotkeys,rust-injection -- self-test ptt-wedge --iterations 5 --json"
      - name: injection-idempotency regression test (self-test)
        # Sibling of ptt-wedge, different bug class: this verb probes
        # INJECTION-side state accumulation (plan-builder determinism,
        # guard bracket counter, backend-selection cache) instead of the
        # hotkey tracker. Default dry-run — no OS side effects — so it's
        # safe in this container. Iteration count intentionally >=10
        # (higher than ptt-wedge) so intermittent state leaks are more
        # likely to surface. Same feature-gate as ptt-wedge.
        # NO `|| true` — a real regression here MUST fail CI.
        if: env.RUN_INTEG == 'true'
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace "$IMAGE" \
            bash -c "cargo run --release --manifest-path src/rust/Cargo.toml --target-dir target -p whisper-dictate-app --features rust-hotkeys,rust-injection -- self-test injection-idempotency --iterations 10 --json"
      - name: audio-capture self-test
        # Exercises the cpal capture path AND the PipeWire quantum lesson
        # from v1.20.6 (`PIPEWIRE_QUANTUM=2048` when unset). Feature-gated
        # behind `audio-capture`; the Ubuntu 26.04 CI image bakes in
        # libasound2-dev so cpal's ALSA backend links.
        #
        # `continue-on-error: true` because the CI container almost never
        # has an audio device wired to a working ALSA loopback — the
        # verb's `AudioCaptureReport::error` will say "no audio device
        # delivered samples" and exit 1. We swallow that non-zero exit
        # rather than the useful signal (a v1.20.6-class regression
        # would surface as either a compile error above OR the verb
        # panicking mid-run, both of which trip the step). When a
        # future CI runner gets an ALSA loopback, promote this back to
        # a hard fail and drop `continue-on-error`.
        if: env.RUN_INTEG == 'true'
        continue-on-error: true
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace "$IMAGE" \
            bash -c "cargo run --release --manifest-path src/rust/Cargo.toml --target-dir target -p whisper-dictate-app --features audio-capture -- self-test audio-capture --duration-ms 500 --json || echo '::notice::audio-capture self-test exited non-zero (expected without a live audio device in the CI container)'"
      - name: whisper-load regression test (self-test)
        # Item 5 prereq 5 (Whisper cold-load latency + OOM). The self-test
        # loads a GGML model through the same background preloader the
        # supervisor will use in Phase C step 2, catching any regression
        # in the whisper-rs API surface, the whisper.cpp OOM behaviour,
        # or the preloader wiring BEFORE it ships to users. Downloads
        # tiny.en (~78 MB) into the runner-scoped cache first — we
        # deliberately don't bake the model into the CI image (see
        # docker/ci-ubuntu2604/README for the "no models baked in"
        # rationale). Combined `--features whisper-rs-local,rust-hotkeys,
        # rust-injection` so this shares the previous step's compile
        # artifacts and doesn't pay a second cold cargo build.
        #
        # continue-on-error: the HuggingFace fetch can flake in CI
        # (rate-limits, transient 5xx) — the ubuntu-2604 job is still
        # informational until model download reliability is proven; a
        # failing tiny.en fetch shouldn't red-X the whole matrix leg.
        # Promote to a hard failure (remove the flag) once model download
        # has ≥50 consecutive green runs.
        if: env.RUN_INTEG == 'true'
        continue-on-error: true
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace "$IMAGE" \
            bash -c "cargo run --release --manifest-path src/rust/Cargo.toml --target-dir target -p whisper-dictate-app --features whisper-rs-local,rust-hotkeys,rust-injection -- models download tiny.en && cargo run --release --manifest-path src/rust/Cargo.toml --target-dir target -p whisper-dictate-app --features whisper-rs-local,rust-hotkeys,rust-injection -- self-test whisper-load --model tiny.en --json"
