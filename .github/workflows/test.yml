name: tests

# Primary CI gate. Test the shipping profile once per OS. Keep alternate
# feature checks, repository policy, and optimized-binary smokes focused.
# Releases reuse this workflow when the tagged commit has no successful push CI.
#
# Required-status-check contexts (per the protected-branch ruleset — do NOT
# rename these job/matrix ids without updating the ruleset):
#   - unit                      (jobs.unit)
#   - lint-workflows            (jobs.lint-workflows)
#   - smoke (ubuntu-latest)     (jobs.smoke matrix)
#   - smoke (windows-2025)      (jobs.smoke matrix)
#   - rust  (ubuntu-latest)     (jobs.rust  matrix — aggregator over rust-features)
#   - rust  (windows-2025)      (jobs.rust  matrix — aggregator over rust-features)

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:        # allow other workflows (e.g. release) to run the full suite as a gate
    inputs:
      ref:
        description: Git ref to check out for all jobs. Defaults to the triggering ref; the release passes the tag so manual re-releases gate on the shipped commit.
        type: string
        required: false
        default: ''

# Cancel superseded runs on the same PR only. Non-PR events (main pushes, the
# release gate via workflow_call) get a unique group so they're never cancelled
# OR serialized/queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  NEXUS_DOCKER_MIRROR: ${{ vars.NEXUS_DOCKER_MIRROR }}

jobs:
  # Compute which categories of files changed so the heavy jobs (Rust matrix,
  # native smoke, integration) can skip themselves while the focused
  # repository-policy job still runs for documentation and policy surfaces.
  # On push to main / workflow_call the path outputs default to true; path
  # filtering is PR-scoped only. A release-version-only change (see the
  # `version` step) turns the rust and audit outputs off on pull requests and
  # main pushes; repository-policy coverage still runs for it.
  #
  # Required-status-check semantics:
  # - Matrix jobs (`smoke`, `rust`) gate via STEP-LEVEL `if:` so the matrix
  #   still expands and emits each required context name (`rust (ubuntu-latest)`,
  #   `smoke (windows-2025)`, ...). A job-level `if:` would skip BEFORE the
  #   matrix expanded, never creating the required check contexts and
  #   leaving branch protection waiting forever.
  changes:
    # `dorny/paths-filter` reads the PR's changed-files list via the GitHub
    # API, which needs `pull-requests: read`. Restricted-token repos default
    # to less than that, so spell it out.
    permissions:
      contents: read
      pull-requests: read
    runs-on: arc-runner-public
    outputs:
      # On workflow_call from a tag release there is no changed-files range,
      # and every gate must run. Pull requests use the API-backed filter;
      # pushes use paths-filter's before/after comparison. Product and policy
      # outputs still default to true outside PRs, while audit retains its
      # path result on main so a dependency push launches it exactly once.
      # Before this fallback the release pipeline startup-failed on tag
      # push: the filter step would have nothing to diff against and the
      # downstream `Fail required check` step would fire.
      # Repository-policy tests inspect the native package, docs and workflows;
      # they are not product runtime code. They still run on a version-only
      # change, which touches the Nix package and Cargo manifests they cover.
      rust: ${{ steps.version.outputs.version_only == 'true' && 'false' || github.event_name == 'pull_request' && steps.filter.outputs.rust || 'true' }}
      repo_tests: ${{ github.event_name == 'pull_request' && steps.filter.outputs.repo_tests || 'true' }}
      ci_image: ${{ github.event_name == 'pull_request' && steps.filter.outputs.ci_image || 'true' }}
      audit: ${{ github.event_name == 'workflow_call' && 'true' || steps.version.outputs.version_only == 'true' && 'false' || steps.filter.outputs.audit || 'false' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_call'
        with:
          ref: ${{ inputs.ref }}
          # The version step diffs a pull request's merge commit against its
          # first parent, the base branch tip.
          fetch-depth: 2
      # A version-only change leaves every byte of code, workflow, script
      # and dependency input identical to the base commit; only the
      # whisper-dictate-app release version string differs (see
      # scripts/ci/version-only-change.sh). The skipped legs therefore
      # already ran on that exact code: in the pull request that produced
      # the base commit, and in the base commit's own push run on main. A
      # main push is compared with `github.event.before`, the previous main
      # tip. Tag pushes (the release calling this workflow), manual runs and
      # any detection error keep the full suite.
      - name: Detect a release-version-only change
        id: version
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=''
          if [ "$EVENT_NAME" = pull_request ]; then
            base=$(git rev-parse --verify --quiet 'HEAD^1') || base=''
          elif [[ "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ && ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            base=$PUSH_BEFORE
            git cat-file -e "$base^{commit}" 2>/dev/null \
              || git fetch --no-tags --depth=1 origin "$base" \
              || base=''
          fi
          version_only=false
          # The detector comes from the base commit, so a change to it never
          # certifies itself; a base without it keeps the full suite.
          detector="$RUNNER_TEMP/version-only-change.sh"
          if [ -n "$base" ] \
            && git cat-file blob "$base:scripts/ci/version-only-change.sh" > "$detector" \
            && verdict=$(bash "$detector" "$base" HEAD); then
            version_only=$verdict
          fi
          echo "version_only=$version_only" >> "$GITHUB_OUTPUT"
          echo "version-only change: $version_only (base: ${base:-none})"
      # Pin to v4.0.1 (Node 24) — GitHub started defaulting JavaScript
      # actions to Node 24 on June 16, 2026 and the Node 20 runtime is
      # scheduled for removal later in 2026. A Node-20-targeted action
      # could brick the `changes` job once the transition lands, which
      # would skip every required check downstream.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        # PRs use the changed-files API; pushes use their before/after range.
        # A release workflow_call skips filtering and runs every gate.
        if: github.event_name != 'workflow_call'
        with:
          filters: |
            # `rust` = touches Rust sources OR shared config a Rust build
            # consumes (schemas, sonar config) OR any workflow YAML (a
            # workflow change must exercise the full matrix). Docker
            # image files are here too because the container leg builds
            # the CI image on-demand from docker/ci-ubuntu2604/.
            rust:
              - 'src/rust/**'
              - 'rust-toolchain.toml'
              - 'sonar-project.properties'
              - 'shared/config/**'
              - 'scripts/**'
              - 'docker/**'
              - 'packaging/**'
              - 'nix/**'
              - '.github/workflows/**'
              - '.github/actionlint.yaml'
            # Repository-policy tests inspect packaging, docs, schemas,
            # scripts and workflows through native Rust integration tests.
            repo_tests:
              - 'AGENTS.md'
              - '*.md'
              - 'docs/**'
              - 'src/rust/**'
              - 'rust-toolchain.toml'
              - 'shared/config/**'
              - 'scripts/**'
              - 'sonar-project.properties'
              - 'docker/**'
              - '.github/workflows/**'
              - '.github/actionlint.yaml'
              - 'packaging/**'
              - 'nix/**'
              # The repository-policy tests scan Rust diffs for missing
              # coverage and generated-doc updates.
            ci_image:
              - 'docker/ci-ubuntu2604/**'
            # Dependency-relevant PRs and main pushes call the reusable audit once.
            # test.yml itself is included so changes to this gate exercise it.
            audit:
              - 'src/rust/Cargo.toml'
              - 'src/rust/Cargo.lock'
              - '.cargo/audit.toml'
              - '.github/workflows/cargo-audit.yml'
              - '.github/workflows/test.yml'

  dependency-audit:
    needs: changes
    if: ${{ needs.changes.outputs.audit == 'true' }}
    uses: ./.github/workflows/cargo-audit.yml
    with:
      ref: ${{ inputs.ref }}

  unit:
    needs: [changes, dependency-audit]
    # `if: !cancelled()` (not the default dependency-success gate) means a
    # `changes` failure does not silently SKIP this required check — branch protection would
    # then let a code PR merge without tests because skipped checks count
    # as success here. The first step explicitly
    # fails if `changes` did not succeed; subsequent steps gate on the
    # `repo_tests` output so documentation and policy-only changes retain
    # repository-policy coverage without running the full Rust suite here.
    if: ${{ !cancelled() }}
    runs-on: arc-runner-public
    env:
      RUN_UNIT: ${{ needs.changes.result == 'success' && (needs.changes.outputs.repo_tests == 'true' || github.event_name != 'pull_request') }}
    steps:
      - name: Fail required check if change detection broke
        if: needs.changes.result != 'success'
        run: |
          echo "::error::changes job did not succeed (result=${{ needs.changes.result }}); failing required \`unit\` check to avoid silently skipping tests on a code PR"
          exit 1
      - name: Fail required check if dependency audit did not succeed
        if: >-
          needs.changes.result == 'success'
          && needs.changes.outputs.audit == 'true'
          && needs.dependency-audit.result != 'success'
        run: |
          echo "::error::dependency audit did not succeed (result=${{ needs.dependency-audit.result }}); failing required \`unit\` check"
          exit 1
      - if: env.RUN_UNIT != 'true'
        run: echo "::notice::no repository-policy changes detected — skipping focused policy and doctest checks"
      - uses: actions/checkout@v7
        if: env.RUN_UNIT == 'true'
        with:
          ref: ${{ inputs.ref }}
          # Native repository-policy tests compare against origin/main, so
          # fetch the base ref instead of the checkout default depth=1.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        if: env.RUN_UNIT == 'true'
      - name: Install Linux build tools and Rust UI build deps
        # The arc-runner-public image ships without a C toolchain (GitHub-hosted
        # images had one). Plain apt, not cache-apt-pkgs-action: that action
        # restored an empty cache on the ARC runners and skipped the install.
        if: env.RUN_UNIT == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake clang libclang-dev libssl-dev pkg-config jq libdbus-1-dev libwayland-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxi-dev libxtst-dev libasound2-dev
      - name: Run repository-policy tests and doctests
        if: env.RUN_UNIT == 'true'
        run: |
          cargo test --manifest-path src/rust/Cargo.toml --locked -p whisper-dictate-app --test repository_policy
          cargo test --manifest-path src/rust/Cargo.toml --locked -p whisper-dictate-app --doc

  lint-workflows:
    # Needs a Docker daemon, so it runs on the dind scale set. That set is
    # never offered to fork PRs: they skip this job instead of running it.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: arc-runner-public-docker
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Resolve actionlint image via Nexus mirror
        id: actionlint_image
        run: |
          set -eu
          upstream_image="rhysd/actionlint:1.7.12"
          mirror_image="${NEXUS_DOCKER_MIRROR:+$NEXUS_DOCKER_MIRROR/$upstream_image}"
          if [ -n "$mirror_image" ] && docker pull "$mirror_image"; then
            echo "image=$mirror_image" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$mirror_image" ]; then
              echo "::notice::Nexus mirror miss for ${mirror_image}; falling back to ${upstream_image}"
            fi
            if docker pull "$upstream_image"; then
              echo "image=$upstream_image" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Failed to pull ${upstream_image} from Docker Hub."
              exit 1
            fi
          fi
      - name: actionlint
        run: docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace "${{ steps.actionlint_image.outputs.image }}" -color

  # Sonar analysis imports Rust LCOV and Python Cobertura from the Linux
  # shipping cell, plus JSON from the Linux clippy cell. Not a required check.
  # Forks get no SONAR_TOKEN, and the release's workflow_call passes no
  # secrets, so the scan runs only where the token is present.
  sonar:
    needs: [changes, rust-features]
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' && needs.rust-features.result == 'success' }}
    runs-on: arc-runner-public
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - if: env.SONAR_TOKEN == ''
        run: echo "::notice::No SONAR_TOKEN for this run — skipping the Sonar scan"
      - uses: actions/checkout@v7
        if: env.SONAR_TOKEN != ''
        with:
          ref: ${{ inputs.ref }}
          # Sonar's new-code detection and blame read the full history.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        if: env.SONAR_TOKEN != ''
        with:
          name: sonar-lcov
      - uses: actions/download-artifact@v8
        if: env.SONAR_TOKEN != ''
        with:
          name: sonar-clippy
      - uses: actions/download-artifact@v8
        if: env.SONAR_TOKEN != ''
        with:
          name: sonar-python-coverage
      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8

  legacy-installer:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: windows-2025
    env:
      RUN_LEGACY_INSTALLER: ${{ needs.changes.result == 'success' && needs.changes.outputs.rust == 'true' }}
    steps:
      - name: Fail if change detection broke
        if: needs.changes.result != 'success'
        run: |
          throw "changes job did not succeed: ${{ needs.changes.result }}"
      - name: Skip on docs-only PRs
        if: env.RUN_LEGACY_INSTALLER != 'true'
        run: Write-Host 'Skipping legacy installer integration - no Windows-relevant changes detected'
      - uses: actions/checkout@v7
        if: env.RUN_LEGACY_INSTALLER == 'true'
        with:
          # The test itself archives v1.25.0. Keep its driver on the reviewed
          # workflow revision when a release workflow supplies an older tag.
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: Install Inno Setup
        if: env.RUN_LEGACY_INSTALLER == 'true'
        run: choco install innosetup -y --no-progress
      - name: Exercise v1.25.0 legacy installer and ZIP payloads
        if: env.RUN_LEGACY_INSTALLER == 'true'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/tests/test-legacy-installer.ps1

  smoke:
    # Keep the required smoke contexts. The shipping matrix checks the CLI
    # against the executable nextest already built.
    needs: [changes, rust-features]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: arc-runner-public
    steps:
      - name: Fail required check if change detection broke
        if: needs.changes.result != 'success'
        run: |
          echo "::error::changes job did not succeed (result=${{ needs.changes.result }}); cannot verify CLI smoke coverage"
          exit 1
      - name: Require successful shipping CLI smokes for Rust changes
        if: needs.changes.outputs.rust == 'true' && needs.rust-features.result != 'success'
        run: |
          echo "::error::rust-features did not succeed; CLI smoke checks are not green"
          exit 1
      - run: echo "CLI smoke gate OK for ${{ matrix.os }}"

  # Shipping runs the full suite. Keep Clippy and PR-only compatibility
  # checks separate so their cache and compiler settings stay independent.
  rust-features:
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
        profile:
          - id: shipping
          - id: clippy-glow
          - id: features
        exclude: ${{ fromJSON(github.event_name == 'pull_request' && '[]' || '[{"profile":{"id":"features"}}]') }}
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'arc-runner-public' || matrix.os }}
    env:
      # `rust` output is the per-language gate (issue #590):
      # a docs/config-only PR that doesn't touch Rust sources, workflow YAML,
      # shared config or scripts skips the whole rust matrix (~5-15 min
      # of wall-clock on Windows). Non-PR events run unless the change is a
      # release-version-only bump.
      RUN_RUST: ${{ needs.changes.result == 'success' && needs.changes.outputs.rust == 'true' }}
    steps:
      - name: Fail matrix leg if change detection broke
        if: needs.changes.result != 'success'
        run: |
          echo "::error::changes job did not succeed (result=${{ needs.changes.result }}); failing rust-features leg so the required \`rust\` aggregator fails too"
          exit 1
      - if: env.RUN_RUST != 'true'
        run: echo "::notice::Skipping rust-features leg (${{ matrix.profile.id }}) — no Rust-relevant changes detected"
      - uses: actions/checkout@v7
        if: env.RUN_RUST == 'true'
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Install Linux build tools and Rust UI build deps
        # The arc-runner-public image ships without a C toolchain, cmake or
        # libclang (GitHub-hosted images had them); whisper-rs-local needs all
        # three. Plain apt, not cache-apt-pkgs-action: that action restored an
        # empty cache on the ARC runners and silently skipped the install.
        # `jq` is required by the audio capture report gate below.
        if: env.RUN_RUST == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake clang libclang-dev libssl-dev pkg-config jq libdbus-1-dev libwayland-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxi-dev libxtst-dev libasound2-dev
      - name: Hviske service tests with coverage
        if: env.RUN_RUST == 'true' && runner.os == 'Linux' && matrix.profile.id == 'shipping'
        env:
          COVERAGE_RCFILE: scripts/hviske/.coveragerc
        run: |
          sudo apt-get install -y --no-install-recommends python3-coverage
          /usr/bin/python3 -m coverage run -m unittest discover -s scripts/hviske
          /usr/bin/python3 -m coverage xml -o hviske-coverage.xml
      - name: Upload the Hviske service coverage report
        if: env.RUN_RUST == 'true' && runner.os == 'Linux' && matrix.profile.id == 'shipping'
        uses: actions/upload-artifact@v7
        with:
          name: sonar-python-coverage
          path: hviske-coverage.xml
          if-no-files-found: error
          retention-days: 1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        if: env.RUN_RUST == 'true'
        with:
          # Every leg installs clippy and llvm-tools; only the clippy-role
          # cell runs clippy and only the Linux shipping cell measures
          # coverage. The extra components cost a few seconds and keep
          # the toolchain-component policy check happy.
          components: clippy, llvm-tools-preview
      - name: Install cargo-nextest
        if: env.RUN_RUST == 'true' && (matrix.profile.id == 'shipping' || matrix.profile.id == 'features')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Install cargo-llvm-cov
        if: env.RUN_RUST == 'true' && runner.os == 'Linux' && matrix.profile.id == 'shipping'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        if: env.RUN_RUST == 'true'
        with:
          # Per-profile key: parallel cells all try to save under the
          # same key otherwise, but actions/cache is immutable-key —
          # only the first upload wins. Every cell then restores THAT
          # winning cell's target/, not its own, so its cargo re-does
          # feature-specific compilation on every warm run. Per-profile
          # keys give each cell a 100% cache hit for
          # its exact feature-set.
          workspaces: "src/rust -> ../target"
          key: ${{ matrix.profile.id }}
      - name: Rust format
        # Formatting is OS- and feature-independent.
        if: env.RUN_RUST == 'true' && matrix.profile.id == 'shipping' && runner.os == 'Linux'
        run: cargo fmt --manifest-path src/rust/Cargo.toml --all -- --check
      - name: Rust Clippy
        if: env.RUN_RUST == 'true' && matrix.profile.id == 'clippy-glow' && runner.os == 'Windows'
        run: cargo clippy --manifest-path src/rust/Cargo.toml --locked --target-dir target -p whisper-dictate-app --all-targets --features ui-egui-glow -- -D warnings
      - name: Rust Clippy with a report for Sonar
        if: env.RUN_RUST == 'true' && matrix.profile.id == 'clippy-glow' && runner.os == 'Linux'
        shell: bash
        run: |
          cargo clippy --manifest-path src/rust/Cargo.toml --locked --target-dir target -p whisper-dictate-app --all-targets --features ui-egui-glow --message-format=json -- -D warnings \
            | tee clippy-report.json | jq -r '.message.rendered // empty'
      - name: Upload the clippy report
        if: env.RUN_RUST == 'true' && matrix.profile.id == 'clippy-glow' && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: sonar-clippy
          path: clippy-report.json
          retention-days: 1
      - name: Rust tests
        if: env.RUN_RUST == 'true' && matrix.profile.id == 'shipping' && runner.os == 'Windows'
        run: cargo nextest run --manifest-path src/rust/Cargo.toml --locked --target-dir target -p whisper-dictate-app --profile ci -E 'not(binary(=repository_policy))' --no-default-features --features shipping
      - name: Rust tests with coverage
        # The Linux shipping suite runs once, instrumented, and its LCOV is
        # Sonar's coverage report (the `sonar` job below). cargo-llvm-cov
        # keeps its own build tree, under the target directory rust-cache
        # restores, and rejects a top-level --target-dir.
        if: env.RUN_RUST == 'true' && runner.os == 'Linux' && matrix.profile.id == 'shipping'
        env:
          CARGO_LLVM_COV_TARGET_DIR: target/llvm-cov-target
        run: cargo llvm-cov nextest --manifest-path src/rust/Cargo.toml --locked -p whisper-dictate-app --profile ci -E 'not(binary(=repository_policy))' --no-default-features --features shipping --lcov --output-path "$GITHUB_WORKSPACE/lcov.info"
      - name: Normalize LCOV source paths to repo root
        # Sonar resolves LCOV `SF:` paths against the project base dir, so they
        # must be repo-root-relative. cargo-llvm-cov may emit absolute paths
        # (strip the workspace prefix) or crate-root-relative ones (the crate is
        # flat under src/rust, so those start with e.g. lib.rs — prefix src/rust/).
        # Both seds are idempotent no-ops when the path is already normalized.
        if: env.RUN_RUST == 'true' && runner.os == 'Linux' && matrix.profile.id == 'shipping'
        run: |
          sed -i "s#^SF:$(pwd)/#SF:#" lcov.info
          sed -i -E "/^SF:src\//! s#^SF:#SF:src/rust/#" lcov.info
          echo "LCOV SF records: $(grep -c '^SF:' lcov.info), sample: $(grep -m1 '^SF:' lcov.info)"
      - name: Upload the coverage report
        if: env.RUN_RUST == 'true' && runner.os == 'Linux' && matrix.profile.id == 'shipping'
        uses: actions/upload-artifact@v7
        with:
          name: sonar-lcov
          path: lcov.info
          retention-days: 1
      - name: Native CLI smoke
        if: env.RUN_RUST == 'true' && matrix.profile.id == 'shipping'
        shell: bash
        env:
          WD_BIN: ${{ runner.os == 'Windows' && 'target/debug/wd.exe' || 'target/llvm-cov-target/debug/wd' }}
          LLVM_PROFILE_FILE: /dev/null
        run: |
          test -x "$WD_BIN"
          "$WD_BIN" --help
          "$WD_BIN" --version
          "$WD_BIN" config path
      - name: Rust feature-set checks
        if: env.RUN_RUST == 'true' && matrix.profile.id == 'features'
        shell: bash
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo check --manifest-path src/rust/Cargo.toml --locked --target-dir target -p whisper-dictate-app --all-targets
          for features in rust-hotkeys audio-capture rust-hotkeys,rust-injection whisper-rs-local,audio-capture,rust-injection; do
            echo "::group::cargo check --features $features"
            cargo check --manifest-path src/rust/Cargo.toml --locked --target-dir target -p whisper-dictate-app --all-targets --features "$features"
            echo "::endgroup::"
          done
      - name: Rust tests that need the default feature set
        # Exercise behavior omitted from the shipping build, not a second full suite.
        if: env.RUN_RUST == 'true' && matrix.profile.id == 'features'
        run: >-
          cargo nextest run --manifest-path src/rust/Cargo.toml --locked --target-dir target
          -p whisper-dictate-app --profile ci --lib --bin wd
          -E 'test(/(_stub_|_without_feature|::reduced_build_|stock_build|unsupported_native_error_is_mapped_to_rebuild_hint|run_with_reports_unsupported_when_local_whisper_feature_absent)/)'
      - name: Rust tests that need a partial feature set
        # This guard is excluded by both default and shipping; run it once on Linux.
        if: env.RUN_RUST == 'true' && matrix.profile.id == 'features' && runner.os == 'Linux'
        run: cargo nextest run --manifest-path src/rust/Cargo.toml --locked --target-dir target -p whisper-dictate-app --profile ci --lib --features rust-hotkeys,rust-injection -E 'test(=runtime::rust_session_sink_tests::production_sink_refuses_without_real_backends)'
      - name: Windows release-script fixture
        if: env.RUN_RUST == 'true' && runner.os == 'Windows' && matrix.profile.id == 'shipping'
        run: cargo test --manifest-path src/rust/Cargo.toml --locked --target-dir target -p whisper-dictate-app --no-default-features --features shipping --test repository_policy windows_extracted_release_scripts_parse_and_execute_cpu_fallback_fixture -- --exact
      - name: Audio capture report gate
        # The shipping cell feeds the required rust aggregators on pull
        # requests. Do not hide build failures or unexpected self-test errors
        # as missing hardware. Push and release runs get the same report gate
        # from the `integration-ubuntu-2604` audio-capture self-test.
        # It runs the `wd` the coverage run built for the integration tests,
        # so the cell compiles the crate once; the binary's own profile
        # output is discarded.
        if: env.RUN_RUST == 'true' && runner.os == 'Linux' && matrix.profile.id == 'shipping' && github.event_name == 'pull_request'
        shell: bash
        env:
          LLVM_PROFILE_FILE: /dev/null
        run: |
          wd="$PWD/target/llvm-cov-target/debug/wd"
          test -x "$wd" || { echo "::error::the coverage run left no wd binary at $wd"; exit 1; }
          bash scripts/integration/audio-capture-smoke.sh "$wd"
  # ---------------------------------------------------------------------------
  # rust: required-status aggregator. Retains the `rust (ubuntu-latest)` and
  # `rust (windows-2025)` context names that the protected-branch ruleset
  # requires. After the 2026-07-26 split this job no longer runs cargo — it
  # aggregates the `rust-features` matrix into the two required contexts so
  # branch protection sees one green check per OS regardless of how many
  # feature cells the matrix expands to. Do NOT rename these matrix legs;
  # branch protection reads the context names verbatim.
  # ---------------------------------------------------------------------------
  rust:
    needs: [changes, rust-features, rust-release]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: arc-runner-public
    steps:
      - name: Fail required check if change detection broke
        if: needs.changes.result != 'success'
        run: |
          echo "::error::changes job did not succeed (result=${{ needs.changes.result }}); failing required \`rust (${{ matrix.os }})\` check"
          exit 1
      - name: Require feature validation for Rust changes
        if: needs.changes.outputs.rust == 'true' && needs.rust-features.result != 'success'
        run: |
          echo "::error::rust-features matrix did not succeed (result=${{ needs.rust-features.result }}); failing required \`rust (${{ matrix.os }})\` check"
          exit 1
      - name: Fail required check if rust-release matrix did not succeed
        # The Windows release CLI-output smoke and injection-idempotency
        # live in rust-release and
        # would otherwise NOT gate the required check — a red
        # `rust-release (windows-2025)` on a PR would still let the
        # aggregator go green and the regression could merge. Gating on
        # rust-release.result closes that gap. `skipped` is fine (docs-only PR).
        if: needs.rust-release.result != 'success' && needs.rust-release.result != 'skipped'
        run: |
          echo "::error::rust-release matrix did not succeed (result=${{ needs.rust-release.result }}); failing required \`rust (${{ matrix.os }})\` check to prevent a Windows regression from merging under a green required context"
          exit 1
      - run: echo "rust aggregator OK for ${{ matrix.os }} — rust-features + rust-release passed"

  # ---------------------------------------------------------------------------
  # rust-release: release-profile builds + release-mode regression smokes.
  #
  # Split coverage by OS to keep Windows-specific regression guards on PR CI
  # while still shedding the Linux release compile from PR turnaround:
  #   - windows-2025: runs on EVERY event (PR + push + workflow_call). The
  #     Windows release CLI-output smoke (the windows_subsystem bug) and
  #     injection-idempotency (SendInput state leakage) are both
  #     Windows-specific and have no equivalent elsewhere in this workflow;
  #     `integration-ubuntu-2604` is Linux-only, so it cannot cover them.
  #     Removing them from PR CI would let a regression merge and only
  #     surface on the post-merge push.
  #   - ubuntu-latest: runs on push-to-main and workflow_call only. The
  #     Linux release build is a link-surface smoke (whisper-rs API compat)
  #     with no unique behavioural guard, and the release pipeline gates
  #     on it via workflow_call before shipping — so PR CI saves ~10 min
  #     without losing pre-ship coverage.
  # ---------------------------------------------------------------------------
  rust-release:
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'arc-runner-public' || matrix.os }}
    env:
      # RUN_RELEASE=false when (a) `changes` failed, (b) docs-only PR or
      # release-version-only change, OR
      # (c) this is the ubuntu leg on a pull_request (Linux release build
      # is push/workflow_call only per the header comment above), OR
      # (d) the PR touches no Rust-relevant paths at all (a docs-only
      # PR doesn't need the Windows regression guards to fire because
      # there's no Rust code to regress).
      # The Windows leg still gets RUN_RELEASE=true on any Rust-touching
      # PR so the Windows release regression guards keep firing pre-merge.
      RUN_RELEASE: >-
        ${{ needs.changes.result == 'success'
            && needs.changes.outputs.rust == 'true'
            && (matrix.os == 'windows-2025' || github.event_name != 'pull_request') }}
    steps:
      - name: Fail check if change detection broke
        if: needs.changes.result != 'success'
        run: |
          echo "::error::changes job did not succeed (result=${{ needs.changes.result }}); failing rust-release leg"
          exit 1
      - if: env.RUN_RELEASE != 'true'
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::notice::Skipping rust-release (ubuntu-latest) — Linux release build is push/workflow_call only"
          else
            echo "::notice::Skipping rust-release leg — no code changes detected"
          fi
        shell: bash
      - uses: actions/checkout@v7
        if: env.RUN_RELEASE == 'true'
        with:
          ref: ${{ inputs.ref }}
      - name: Install Linux build tools and Rust UI build deps
        # The arc-runner-public image ships without a C toolchain, cmake or
        # libclang (GitHub-hosted images had them); whisper-rs-local needs all
        # three. Plain apt, not cache-apt-pkgs-action: that action restored an
        # empty cache on the ARC runners and silently skipped the install.
        if: env.RUN_RELEASE == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake clang libclang-dev libssl-dev pkg-config jq libdbus-1-dev libwayland-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxi-dev libxtst-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        if: env.RUN_RELEASE == 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.RUN_RELEASE == 'true'
        with:
          workspaces: "src/rust -> ../target"
          # Release profile compiles into its own target sub-tree; keep
          # its cache separate from the PR-CI debug caches above.
          key: release
      - name: Rust build (exact shipping profile)
        # The `whisper-rs-local` feature compiles
        # whisper.cpp from source via whisper-rs and is now shipping in
        # the release installer. Build-only (not `cargo test`) because
        # whisper-rs's own integration tests want a GGML model fixture
        # we don't ship; this step just confirms the C++/Rust link
        # boundary still compiles on both runners. Without this gate the
        # release pipeline (which builds `--features ...,whisper-rs-local`)
        # would be the first place a whisper-rs API break surfaces, and
        # that's too late.
        #
        # `audio-capture` is included alongside so the release binary
        # produced here carries the `self-test audio-capture` / `dictate-mic`
        # verbs the next step's smoke asserts on. Same release-profile
        # target-dir, so no extra compile — the feature just brings in
        # cpal + rubato to the same artifact.
        if: env.RUN_RELEASE == 'true'
        run: cargo build --manifest-path src/rust/Cargo.toml --target-dir target -p whisper-dictate-app --bins --no-default-features --features shipping --release
      - name: Checkout reviewed Windows release smoke tooling
        uses: actions/checkout@v7
        if: env.RUN_RELEASE == 'true' && runner.os == 'Windows'
        with:
          # A release workflow may check out an older application tag through
          # inputs.ref. Keep this extracted smoke helper on the reviewed
          # workflow revision so historical tags can still run the gate.
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: scripts/windows/tests/smoke-release-binaries.ps1
          sparse-checkout-cone-mode: false
      - name: Windows release CLI-output smoke
        # Regression guard for the `windows_subsystem = "windows"` bug class:
        # a GUI-subsystem release binary has no console attached,
        # so every CLI verb silently discarded its stdout when a user ran
        # it from PowerShell. Debug builds hide this — the attribute is
        # gated on `not(debug_assertions)` — so only a RELEASE binary check
        # catches it. Reuses the release exe built by the step above (no
        # extra compile). Windows-only because the bug is a Windows PE
        # subsystem attribute.
        #
        # Two orthogonal checks:
        #
        #  1) PE Optional Header Subsystem field (the definitive guard).
        #     GUI subsystem = 2 (IMAGE_SUBSYSTEM_WINDOWS_GUI); console = 3
        #     (IMAGE_SUBSYSTEM_WINDOWS_CUI). Read directly from the binary
        #     because a redirected `& $exe` in PowerShell gives GUI-subsystem
        #     processes an explicit stdout pipe handle — so a content-only
        #     check tautologically passes for the exact binary this guard
        #     is meant to reject. Inspecting the PE header
        #     is bit-exact — it cannot be gamed by shell redirection.
        #     Layout: DOS header e_lfanew (UInt32 at 0x3C) → PE signature →
        #     COFF header (24 bytes) → Optional Header; Subsystem is a
        #     UInt16 at offset 68 (0x44) within the Optional Header, i.e.
        #     e_lfanew + 24 + 68 = e_lfanew + 0x5C in the file.
        #
        #  2) Content smokes on top: `config path` (headless-safe, exit 0,
        #     prints a path) + `self-test audio-capture --json` (audio verb
        #     reaches cpal and prints its JSON envelope BEFORE the exit
        #     decision — so a healthy binary still produces JSON on a
        #     mic-less CI runner). Catches missing verbs, panics on
        #     first-frame init, and other "the binary is broken in a way
        #     other than the subsystem attr" regressions.
        #
        # `pwsh` propagates $LASTEXITCODE from the last native call, and
        # `self-test audio-capture` exits non-zero without a mic on the
        # runner. Force `exit 0` after both content checks pass so the
        # environmental exit code does not shadow the smoke's real result.
        if: env.RUN_RELEASE == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File .release-tools/scripts/windows/tests/smoke-release-binaries.ps1

      - name: injection-idempotency regression test (self-test)
        # Keep the Windows SendInput regression on pull requests. Linux
        # also exercises injection in the Ubuntu 26.04 compatibility job.
        if: env.RUN_RELEASE == 'true'
        shell: bash
        run: |
          wd=target/release/wd
          if [[ "$RUNNER_OS" == Windows ]]; then wd+=.exe; fi
          "$wd" self-test injection-idempotency --iterations 10 --json

  integration-ubuntu-2604:
    # Exercise the shipping executable against Ubuntu 26.04 system libraries
    # without rerunning the Rust suite. Prefer the published image; build it
    # inline when the Dockerfile changes or the image isn't available yet.
    needs: changes
    # Needs a Docker daemon, so it runs on the dind scale set. That set is
    # never offered to fork PRs: they skip this job instead of running it.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: arc-runner-public-docker
    permissions:
      contents: read
      packages: read
    env:
      # Only Rust-relevant changes need the container runtime checks.
      RUN_INTEG: ${{ needs.changes.result == 'success' && needs.changes.outputs.rust == 'true' }}
      FORCE_IMAGE_BUILD: ${{ github.event_name == 'pull_request' && needs.changes.outputs.ci_image == 'true' }}
      IMAGE: ghcr.io/factusconsulting/whisper-dictate-ci-ubuntu2604:latest
    steps:
      - name: Skip on docs-only PRs
        if: env.RUN_INTEG != 'true'
        run: echo "::notice::Skipping ubuntu 26.04 integration — no code changes detected"
      - uses: actions/checkout@v7
        if: env.RUN_INTEG == 'true'
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Log in to GHCR (pull only)
        if: env.RUN_INTEG == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve container image (pull or build)
        if: env.RUN_INTEG == 'true'
        run: |
          set -euxo pipefail
          build_image() {
            upstream_base="ubuntu:26.04"
            base_image="$upstream_base"
            mirror_base="${NEXUS_DOCKER_MIRROR:+$NEXUS_DOCKER_MIRROR/library/ubuntu:26.04}"
            if [ -n "$mirror_base" ] && docker pull "$mirror_base"; then
              base_image="$mirror_base"
            elif [ -n "$mirror_base" ]; then
              echo "::notice::Nexus mirror miss for ${mirror_base}; using ${upstream_base}"
            fi
            docker build --build-arg CI_BASE_IMAGE="$base_image" -t "$IMAGE" docker/ci-ubuntu2604/
          }
          if [ "$FORCE_IMAGE_BUILD" = 'true' ]; then
            echo "Dockerfile changed; building the CI image from this PR before testing"
            build_image
          elif docker pull "$IMAGE"; then
            echo "using published image"
          else
            echo "image not yet published, building inline from docker/ci-ubuntu2604/"
            build_image
          fi
      - name: Build the shipping CLI inside the container
        if: env.RUN_INTEG == 'true'
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace "$IMAGE" \
            cargo build --locked --release --manifest-path src/rust/Cargo.toml --target-dir target \
              -p whisper-dictate-app --no-default-features --features shipping --bin wd
      - name: CLI smoke (models list) inside container
        if: env.RUN_INTEG == 'true'
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace "$IMAGE" \
            target/release/wd models list
      - name: PTT-wedge regression test (self-test)
        if: env.RUN_INTEG == 'true'
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace "$IMAGE" \
            target/release/wd self-test ptt-wedge --iterations 5 --json
      - name: injection-idempotency regression test (self-test)
        if: env.RUN_INTEG == 'true'
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace "$IMAGE" \
            target/release/wd self-test injection-idempotency --iterations 10 --json
      - name: audio-capture self-test
        # Fail malformed reports and regressions; only a confirmed missing
        # input device is a skip.
        if: env.RUN_INTEG == 'true'
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace "$IMAGE" \
            bash scripts/integration/audio-capture-smoke.sh /workspace/target/release/wd
      - name: whisper-load regression test (self-test)
        # The model is not baked into the image; the fetch can fail transiently.
        if: env.RUN_INTEG == 'true'
        continue-on-error: true
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace "$IMAGE" \
            bash -ec '
              target/release/wd models download tiny.en
              target/release/wd self-test whisper-load --model tiny.en --json
            '
