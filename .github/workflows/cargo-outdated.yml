name: cargo-outdated

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Verify the lockfile is current
        run: cargo metadata --manifest-path src/rust/Cargo.toml --locked

      - name: Install cargo-outdated
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-outdated

      - name: Report outdated root dependencies
        run: cargo outdated --manifest-path src/rust/Cargo.toml --root-deps-only
