name: nemotron-integration-rust

on:
  push:
    branches: [main]
    paths: &nemotron_paths
      - 'src/rust/Cargo.toml'
      - 'src/rust/Cargo.lock'
      - 'src/rust/cloud_api/**'
      - 'src/rust/credentials.rs'
      - 'src/rust/credentials_tests.rs'
      - 'src/rust/dictate/**'
      - 'src/rust/runtime/**'
      - 'src/rust/tests/nemotron_cloud_stt.rs'
      - 'src/rust/tests/fixtures/hello_speech.wav'
      - 'src/rust/whisper/**'
      - 'shared/config/**'
      - 'docs/STT_BACKENDS.md'
      - '.github/workflows/nemotron-integration-rust.yml'
  pull_request:
    paths: *nemotron_paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  nemotron-integration-rust:
    # This is intentionally informational/non-required, like the Groq live
    # integration.  It still fails visibly when a configured secret or the
    # hosted service regresses, but NVIDIA availability/quota must not block a
    # merge.  The test itself skips safely when the secret is unavailable.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'arc-runner-public' || matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install ARC runner build tools and Linux Rust UI build deps
        # The arc-runner-public image ships without a C toolchain or the -dev
        # libraries that GitHub-hosted images preinstalled.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake clang libclang-dev libssl-dev pkg-config libdbus-1-dev libwayland-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxi-dev libxtst-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust
      - name: Nemotron hosted Riva integration test (real hello.wav)
        env:
          NEMOTRON_API_KEY: ${{ secrets.NEMOTRON_API_KEY }}
          NEMOTRON_GRPC_ENDPOINT: https://grpc.nvcf.nvidia.com:443
          NEMOTRON_MODEL: nvidia/nemotron-speech-streaming-en-0.6b
          NEMOTRON_LANGUAGE_CODE: en-US
        run: cargo test --manifest-path src/rust/Cargo.toml --target-dir src/rust/target --test nemotron_cloud_stt -- --nocapture
