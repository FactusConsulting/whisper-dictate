name: groq-integration-rust

on:
  push:
    branches: [main]
    paths: &groq_paths
      - 'src/rust/Cargo.toml'
      - 'src/rust/Cargo.lock'
      - 'src/rust/cli.rs'
      - 'src/rust/main.rs'
      - 'src/rust/cloud_api/**'
      - 'src/rust/config/**'
      - 'src/rust/credentials.rs'
      - 'src/rust/credentials_tests.rs'
      - 'src/rust/dictate/backend.rs'
      - 'src/rust/dictate/backends/**'
      - 'src/rust/dictate/mod.rs'
      - 'src/rust/dictate/ops.rs'
      - 'src/rust/dictate/provenance.rs'
      - 'src/rust/dictate/provenance_tests.rs'
      - 'src/rust/dictate/session/**'
      - 'src/rust/dictate/simulate.rs'
      - 'src/rust/dictate/simulate_tests.rs'
      - 'src/rust/dictionary/**'
      - 'src/rust/formatting.rs'
      - 'src/rust/postprocess/**'
      - 'src/rust/runtime/cloud_api_keys.rs'
      - 'src/rust/runtime/cloud_api_keys_tests.rs'
      - 'src/rust/tests/cloud_transcribe_env_key.rs'
      - 'src/rust/tests/fixtures/hello_speech.wav'
      - 'src/rust/tests/groq_cloud_stt.rs'
      - 'src/rust/transcribe_file.rs'
      - 'src/rust/transcribe_file_tests.rs'
      - 'shared/config/**'
      - 'scripts/integration/groq-cli-smoke.sh'
      - 'src/python/tests/fixtures/hello.wav'
      - '.github/workflows/groq-integration-rust.yml'
  pull_request:
    paths: *groq_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  groq-integration-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust
      - name: Groq cloud-STT integration test (real hello.wav)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: cargo test --manifest-path src/rust/Cargo.toml --target-dir src/rust/target --test groq_cloud_stt -- --nocapture
      - name: Groq CLI chain smoke (cloud-transcribe -> postprocess -> format)
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: bash scripts/integration/groq-cli-smoke.sh
