name: Claude PR review

# Automatic code-review pass on every NEW pull request. Uses the
# CLAUDE_CODE_OAUTH_TOKEN org-level secret (subscription-based, no
# pay-per-token cost) -- same token as the on-demand @claude workflow in
# claude.yml.
#
# Single round per PR: triggers on `opened` only, NOT on every push to
# the PR branch. Per-push re-review would spend review-context tokens on
# rounds of diminishing returns. If a developer wants a fresh pass after
# pushing fixes, they can @claude in a comment (handled by claude.yml).

on:
  pull_request:
    types: [opened]
    # NO paths-ignore here, deliberately — see sonar.yml, which does
    # have one. This workflow subscribes to `opened` ONLY, so it gets
    # exactly one shot per pull request. Filtering that shot on paths
    # means a PR opened with just a README edit is skipped, and if code
    # is pushed to it afterwards the `synchronize` event has nothing
    # subscribed to it — so the PR never gets an automatic review at
    # all, silently, for the rest of its life. Sonar can afford the
    # filter because it re-runs on every push; this cannot. Do NOT
    # reintroduce paths filtering here.
  # Allow manual re-trigger from the Actions tab on a stuck PR.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to re-review (manual override)'
        required: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  # One review per PR at a time -- avoids racing review threads if a
  # workflow_dispatch lands during the automatic opened pass.
  group: claude-review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # On `pull_request: opened`, GitHub already exposes the PR head
      # via `github.event.pull_request.head.ref`. On `workflow_dispatch`,
      # we have to resolve the PR's head ref from the `pr_number` input
      # before checkout -- otherwise checkout lands on the default
      # branch and the review runs against an empty diff.
      - name: Resolve PR head ref (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        id: dispatch_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.inputs.pr_number }}" --jq '.head.ref')
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Resolved manual PR #${{ github.event.inputs.pr_number }} -> $ref"

      - uses: actions/checkout@v7
        with:
          # Need history to diff against the PR base for context.
          fetch-depth: 0
          # On pull_request, checkout@v5 uses the PR head automatically.
          # On workflow_dispatch, point it at the resolved ref above so
          # the manual re-trigger actually reviews the right PR.
          ref: ${{ github.event_name == 'workflow_dispatch' && steps.dispatch_pr.outputs.ref || github.event.pull_request.head.ref }}
          # Fork PRs live in a different repo; without this `repository:`
          # the checkout would fetch the base repo's branch (which may
          # not exist) and the review runs against an empty / wrong
          # tree. `github.event.pull_request.head.repo.full_name` is the
          # fork's owner/repo for forked PRs and the base repo for
          # same-repo PRs, so it's safe in both modes.
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}

      - uses: anthropics/claude-code-action@v1
        env:
          # The inline-comment MCP server reads PR_NUMBER to know which
          # PR to attach comments to. The action falls back to
          # `github.event.pull_request.number` on `pull_request` runs,
          # but on `workflow_dispatch` that's null -- so wire the
          # dispatch input through explicitly.
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action's PR-review surface lives behind an MCP tool
          # (`mcp__github_inline_comment__create_inline_comment`) that
          # is NOT in the default allow-list when a custom `prompt:` is
          # supplied (agent mode). Without this entry, Claude can read
          # the diff but cannot post any inline review comment.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
          # Restrict to the dependency-bump bots that AGENTS.md gates
          # apply to. `'*'` would also accept arbitrary third-party bots
          # in public forks / scripted PRs, handing them the Claude
          # OAuth + `pull-requests: write` token. Anthropic's security
          # docs flag the wildcard.
          allowed_bots: 'dependabot[bot],renovate[bot]'
          prompt: |
            You are this repository's automated code reviewer. Open the
            pull request's diff and review it end-to-end, then post
            inline review comments on the specific lines that warrant
            attention.

            **AGENTS.md hard gate**: every comment you post must be
            triaged + resolved before the PR can merge. Be SELECTIVE.
            Only flag findings that change correctness, safety, or
            shippability:

            - Logic bugs, off-by-one, missing boundary checks, race
              conditions (especially around the chord-cancel epoch
              guard in `dictate::session`).
            - Security: hard-coded secrets/keys, unvalidated subprocess
              args, path-injection, panics on attacker-controlled input.
            - Breaking API changes without migration path or deprecation
              shim.
            - Test coverage gaps on NEW production code (SonarCloud
              gates at 80% new-code coverage and will block merge).
            - **NEW** files exceeding 500 LOC -- propose a split. The
              repo has pre-existing files over the limit (runtime.rs,
              and other legacy modules) that AGENTS.md grandfathers; only
              flag files this PR adds or grows past 500.
            - Env-var mutations in tests without `ENV_LOCK` -- the
              mutation leaks into every later test that prints.
            - Worker-event wire-format drift between Rust producers and
              consumers.

            **DO NOT post** comments for style, naming, micro-
            optimisation, documentation phrasing, or any other nit --
            those produce review-thread noise the hard gate forces a
            developer to triage even when the suggestion isn't
            actionable.

            **What linters/CI already cover** (skip):
            - Formatting -- `cargo fmt` / `rustfmt` rules.
            - Spelling -- `cspell.json` is the source of truth.
            - Pure clippy nits already in the CI matrix.

            **Project context** (read these BEFORE reviewing):
            - For every changed file, read the root `AGENTS.md` and every
              `AGENTS.md` in its parent directories. Apply all applicable
              rules, with the most local file taking precedence.
            - The root `AGENTS.md` contains the repository-wide modularity
              rule, validation commands, model-economy guidance, and the
              pull-request-review hard gate you are part of.
            - The native Rust architecture is now the production path;
              new code should stay within the Rust runtime and its
              explicit CLI/UI boundaries.

            Use the inline review comment surface
            (`mcp__github_inline_comment__create_inline_comment`), NOT
            a top-level "summary" comment, so every finding lands as a
            resolvable review thread per the AGENTS.md hard gate.
