name: windows-installer-build

# SINGLE SOURCE OF TRUTH for the Windows installer build.
#
# This reusable workflow (on: workflow_call) builds and stages the Inno Setup
# .exe, portable Windows ZIP, Chocolatey .nupkg and winget manifests. Publication
# is deliberately owned by callers after their required gates have passed. It is
# invoked by BOTH:
#   - .github/workflows/release.yml      (the `windows-installer` job, on tag push)
#   - .github/workflows/windows-installer.yml (manual `workflow_dispatch` rebuild)
#
# WHY ONE FILE: these steps used to be duplicated inline in release.yml AND in
# windows-installer.yml. A prerelease Inno fix was applied to only one copy, so
# two RCs failed. Keeping the build in exactly one place makes that class of
# drift impossible — both callers run the identical steps below.
#
# The caller resolves the tag and prerelease flag and passes them in, so this
# workflow contains no tag/prerelease detection or external publication logic.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build the installer for, e.g. v1.9.5 or v1.9.5-rc.1'
        type: string
        required: true
      is_prerelease:
        description: >-
          'true' for an RC tag (vX.Y.Z-rc.N), 'false' for a final. Gates the
          finals-only winget manifest generation; Chocolatey pack/publish run for
          both. Passed as a string so callers can forward another job's output
          verbatim.
        type: string
        required: false
        default: 'false'
      force_build:
        description: >-
          When true, skip the Windows-relevant-changes gate and always build
          (used by releases and manual rebuilds). When false, build only if
          Windows-relevant files changed since the previous tag.
        type: boolean
        required: false
        default: false
jobs:
  build-installer:
    runs-on: windows-2025
    permissions:
      contents: read
    outputs:
      built: ${{ steps.win-check.outputs.changed }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      # SHA that owns this workflow definition. Manual rebuilds check out an
      # older tag below, so helper scripts must be materialized from this SHA,
      # not assumed to exist in the historical worktree.
      BUILD_RECIPE_SHA: ${{ github.workflow_sha }}
      # Kill-switch for the whisper.cpp Vulkan build (#645). Default '1' =
      # ship a GPU-capable Windows binary (whisper-rs-vulkan feature + Vulkan
      # SDK setup + linked-backend regression check). Override to '0' at the
      # repo (Settings -> Secrets and variables -> Actions -> Variables) by
      # adding `VOICEPI_BUILD_VULKAN=0` if the Vulkan SDK action or the build
      # ever wedges, and re-run the release to ship a CPU-only artefact
      # without editing this workflow. The runtime falls back to CPU cleanly
      # per `should_use_gpu` in src/rust/whisper/gpu.rs.
      VOICEPI_BUILD_VULKAN: ${{ vars.VOICEPI_BUILD_VULKAN || '1' }}
    steps:
      - name: Resolve tag
        shell: bash
        run: |
          # The caller (release.yml / windows-installer.yml) already resolved the
          # tag; this workflow just records it for the steps below.
          echo "TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Check for Windows-relevant changes
        id: win-check
        shell: bash
        run: |
          # force_build makes releases and manual rebuilds deterministic. The
          # diff gate remains available to other callers.
          if [ "${{ inputs.force_build }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$prev" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Also gate on the release/installer workflow files so a
          # build-recipe change (e.g. adding --features rust-injection
          # to the cargo build step) re-builds the installer even when
          # no shipping source files changed. Without this a
          # workflow-only release tag would silently skip the installer
          # rebuild and the new flag would never reach Windows artifacts
          # (P2 #400 Codex finding 2).
          changed=$(git diff --name-only "$prev" HEAD -- \
            src/rust/Cargo.toml src/rust/Cargo.lock src/rust/ \
            src/ \
            shared/config/ \
            scripts/ \
            packaging/windows/ \
            .github/workflows/windows-installer-build.yml \
            .github/workflows/release.yml)
          if [ -n "$changed" ]; then
            echo "changed=true"  >> "$GITHUB_OUTPUT"
            echo "Windows files changed since $prev:"
            echo "$changed"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Windows-specific changes since $prev - skipping installer build"
          fi

      - name: Materialize release feature resolver from the reviewed build recipe
        if: steps.win-check.outputs.changed == 'true'
        shell: pwsh
        run: |
          $resolver = Join-Path $env:RUNNER_TEMP 'resolve-release-features.ps1'
          git show "$($env:BUILD_RECIPE_SHA):scripts/windows/resolve-release-features.ps1" |
            Set-Content -LiteralPath $resolver -Encoding utf8
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $resolver)) {
            throw "Could not materialize the release feature resolver from build recipe $env:BUILD_RECIPE_SHA"
          }
          "RELEASE_FEATURE_RESOLVER=$resolver" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      - name: Install Inno Setup
        if: steps.win-check.outputs.changed == 'true'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        if: steps.win-check.outputs.changed == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.win-check.outputs.changed == 'true'
        with:
          workspaces: "src/rust -> ../target"
          # Vulkan flip (#645): the release cache is now Vulkan-linked. Keep it
          # separate from any prior CPU-only release-windows cache so a warm cache
          # from a pre-Vulkan run cannot pollute this build (a cached whisper-rs-sys
          # artefact from the CPU build would silently omit GGML_VULKAN symbols).
          # Bump this suffix again if the Vulkan link surface changes -- e.g. the
          # `-ninja` suffix below was added when the outer cmake generator flipped
          # from Visual Studio 17 to Ninja (see the "Build Rust desktop UI" step
          # comment) so a warm VS-generator cache cannot pollute the Ninja build.
          shared-key: "rust-release-windows-vulkan-ninja"
          cache-on-failure: true

      # MSVC developer environment (INCLUDE / LIB / LIBPATH / cl.exe on PATH).
      # Needed by the Vulkan Ninja build below: with the outer cmake generator
      # forced to Ninja (see the "Build Rust desktop UI" step comment), Ninja
      # invokes cl.exe directly instead of going through MSBuild -- and cl.exe
      # requires the vcvars-style env to find <stdio.h> etc. `ilammy/msvc-dev-cmd`
      # exports those into $GITHUB_ENV so every later step (cargo, the outer
      # cmake, the ExternalProject_Add sub-cmake for vulkan-shaders-gen, the
      # nested Ninja/cl.exe compile of `CMakeTestCCompiler`'s probe program)
      # inherits them. Without this the sub-cmake's CMakeTestCCompiler check
      # fails with "The C compiler is not able to compile a simple test
      # program" (the #647 rc.10/rc.11 vulkan-shaders-gen ExternalProject
      # failure with `error MSB8066: Custom build for '...vulkan-shaders-gen*
      # .rule;...ggml-vulkan\CMakeLists.txt' exited with code 1`).
      # Skipped when Vulkan is off since the CPU build takes cmake-rs's default
      # Visual Studio generator and does not need this.
      - name: Set up MSVC developer environment (Vulkan build)
        if: steps.win-check.outputs.changed == 'true' && env.VOICEPI_BUILD_VULKAN != '0'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Vulkan SDK is needed at BUILD time to compile whisper.cpp's GGML_VULKAN
      # backend: whisper.cpp compiles its GPU shaders at build time via `glslc`
      # (from shaderc), and the whisper-rs-sys build script links against the
      # SDK's vulkan-1 import library. At RUNTIME the user's NVIDIA / AMD /
      # Intel driver ships vulkan-1.dll (Windows 10+ with any up-to-date GPU
      # driver), so no runtime DLL travels in the installer.
      #
      # Uses jakoch/install-vulkan-sdk-action (the LunarG installer, which
      # includes glslc) NOT humbletim/setup-vulkan-sdk (headers+loader only,
      # no glslc → whisper.cpp's shader compile step fails). Sets
      # VULKAN_SDK; the "Build Rust desktop UI" step below adds
      # $VULKAN_SDK\Bin to PATH so cargo's build script finds glslc.
      #
      # Skipping this step (or setting `VOICEPI_BUILD_VULKAN=0` on the repo
      # Variables tab) yields a CPU-only build — the transcribe path still
      # works, GPU just falls back per `should_use_gpu` in
      # src/rust/whisper/gpu.rs.
      - name: Install Vulkan SDK (Windows GPU acceleration for whisper.cpp)
        if: steps.win-check.outputs.changed == 'true' && env.VOICEPI_BUILD_VULKAN != '0'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.3.290.0
          install_runtime: true
          cache: true
          stripdown: true

      # Cache for the short-CARGO_TARGET_DIR Vulkan build below. The
      # Swatinem/rust-cache step above (workspaces: "src/rust -> ../target")
      # only ever caches the workspace-relative `target/` dir, so when the
      # Vulkan branch redirects cargo output to `D:\t` (the MAX_PATH
      # workaround for whisper.cpp's vulkan-shaders-gen ExternalProject_Add
      # -- see the "Build Rust desktop UI" step comment) Swatinem has
      # nothing to save and every RC re-downloads and re-compiles the whole
      # Rust + whisper.cpp + Vulkan tree (~5+ min cold). Cache the
      # per-profile subdirs cargo actually reuses (`.fingerprint`, `deps`,
      # `build`, `incremental`) so a re-run with the same Cargo.lock is
      # incremental. Key on the Vulkan-inclusive feature set so a Vulkan
      # build never restores from a CPU-only warm cache (a Vulkan feature
      # flip would silently omit GGML_VULKAN symbols on cache-hit).
      # restore-keys deliberately does NOT strip the Vulkan suffix so a
      # CPU-only key can never accidentally satisfy a Vulkan restore.
      # Bump the cache version (`v1`) whenever the whisper-rs-sys /
      # ExternalProject build surface changes to force a fresh build.
      #
      # NOTE: actions/cache@v4 does not have `cache-on-failure` /
      # `save-always` (removed in v4 in favor of a separate save step).
      # This step saves only on job success, matching cargo's own "green
      # then cache" contract. A red build leaves the cache untouched so
      # a partial C:\t\release\build never poisons the next run.
      - name: Cache short Vulkan target dir
        if: steps.win-check.outputs.changed == 'true' && env.VOICEPI_BUILD_VULKAN != '0'
        uses: actions/cache@v6
        with:
          path: |
            D:\t\release\.fingerprint
            D:\t\release\build
            D:\t\release\deps
            D:\t\release\incremental
          key: rust-release-windows-vulkan-shorttarget-v1-${{ hashFiles('src/rust/Cargo.lock') }}
          restore-keys: |
            rust-release-windows-vulkan-shorttarget-v1-

      - name: Build Rust desktop UI
        if: steps.win-check.outputs.changed == 'true'
        shell: pwsh
        run: |
          # The named Cargo profiles are the single source of truth for the
          # shipping runtime. Vulkan is selected by the default GPU build;
          # setting the repo variable
          # `VOICEPI_BUILD_VULKAN=0` drops it back to a CPU-only artefact
          # without editing this recipe.
          $featurePlan = & $env:RELEASE_FEATURE_RESOLVER `
            -ManifestPath src/rust/Cargo.toml `
            -ReleaseTag $env:TAG
          if ($featurePlan.Mode -eq 'named') {
            $vulkanFeatureArgs = @('--no-default-features', '--features', 'shipping-vulkan')
            $cpuFeatureArgs = @('--no-default-features', '--features', 'shipping')
          } else {
            # Tags before #806 predate named shipping profiles and accumulated
            # explicit features over time. Use only names declared by the
            # checked-out manifest so older tags never receive unknown flags.
            Write-Host "Tag predates shipping profiles; resolved legacy CPU features: $($featurePlan.CpuFeatures -join ',')"
            $cpuFeatureArgs = @()
            if ($featurePlan.CpuFeatures.Count -gt 0) {
              $cpuFeatureArgs = @('--features', ($featurePlan.CpuFeatures -join ','))
            }
            $vulkanFeatureArgs = @()
            if ($featurePlan.VulkanFeatures.Count -gt 0) {
              $vulkanFeatureArgs = @('--features', ($featurePlan.VulkanFeatures -join ','))
            }
            if (-not $featurePlan.SupportsVulkan -and $env:VOICEPI_BUILD_VULKAN -ne '0') {
              Write-Host 'Checked-out tag has no whisper-rs-vulkan feature; using its CPU release surface'
              $env:VOICEPI_BUILD_VULKAN = '0'
              'VOICEPI_BUILD_VULKAN=0' | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
            }
          }
          $legacyOnnxRequired = $featurePlan.Mode -eq 'legacy' -and $featurePlan.OnnxRuntimeRequired
          "LEGACY_ONNX_REQUIRED=$($legacyOnnxRequired.ToString().ToLowerInvariant())" |
            Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          if ($legacyOnnxRequired -and -not (
            Select-String -LiteralPath packaging/windows/inno/whisper-dictate.iss -Pattern 'onnxruntime\*\.dll' -Quiet
          )) {
            throw 'This legacy tag enables audio-in-rust but its Inno recipe does not package the required ONNX Runtime sidecar.'
          }
          $builtReleaseDir = Join-Path $PWD 'target\release'
          if ($env:VOICEPI_BUILD_VULKAN -ne '0') {
            # whisper.cpp's cmake looks for glslc via PATH; the LunarG
            # installer puts it in $VULKAN_SDK\Bin. Prepend so any bundled
            # MSYS / MinGW shim can't shadow it.
            if (-not $env:VULKAN_SDK) { throw "VULKAN_SDK not set - the 'Install Vulkan SDK' step did not run or failed silently" }
            $env:PATH = (Join-Path $env:VULKAN_SDK 'Bin') + ';' + $env:PATH
            Write-Host "VULKAN_SDK = $env:VULKAN_SDK"
            $glslc = (Get-Command glslc -ErrorAction SilentlyContinue).Source
            if (-not $glslc) { throw "glslc not on PATH after VULKAN_SDK\Bin prepend - SDK layout regression" }
            Write-Host "glslc = $glslc"
            # Force cmake generator to Ninja for BOTH the outer whisper-rs-sys
            # build AND the nested vulkan-shaders-gen ExternalProject_Add.
            # cmake-rs reads CMAKE_GENERATOR when the crate's build.rs did not
            # call `.generator(...)` (whisper-rs-sys does not), and whisper.cpp's
            # ExternalProject_Add for vulkan-shaders-gen does not pass -G to its
            # nested cmake so the env var propagates there too. Why NOT the
            # Visual Studio generator (cmake-rs's msvc default): the vulkan
            # backend's shaders-gen sub-build then runs MSBuild-inside-MSBuild
            # (outer MSBuild -> Custom Build Step -> nested cmake -> nested
            # MSBuild for CMakeTestCCompiler), and the nested MSBuild's
            # implicit toolset detection lost the vcvars env from the outer
            # Custom Build Step, tripping "The C compiler is not able to
            # compile a simple test program" (#647 rc.10/rc.11: `error MSB8066:
            # Custom build for '...vulkan-shaders-gen*.rule;...ggml-vulkan\
            # CMakeLists.txt' exited with code 1`). Ninja invokes cl.exe
            # directly with no MSBuild layer -- cheaper and, combined with the
            # "Set up MSVC developer environment" step above that puts vcvars
            # in $GITHUB_ENV, gives the nested cmake's compiler probe a working
            # cl.exe on the first try. Ninja is preinstalled on
            # windows-2025 via VS 2022 Build Tools; ilammy/msvc-dev-cmd adds
            # its bin dir to PATH.
            $env:CMAKE_GENERATOR = 'Ninja'
            $ninja = (Get-Command ninja -ErrorAction SilentlyContinue).Source
            if (-not $ninja) { throw "ninja not on PATH - the 'Set up MSVC developer environment' step did not run or the VS 2022 Ninja shipment moved" }
            Write-Host "ninja = $ninja"
            Write-Host "CMAKE_GENERATOR = $env:CMAKE_GENERATOR (forced Ninja to avoid MSBuild-in-MSBuild in the vulkan-shaders-gen sub-build)"
            # Short CARGO_TARGET_DIR to keep the vulkan-shaders-gen
            # ExternalProject_Add TryCompile probe path below Windows'
            # MAX_PATH ~260-char cap. The default runner cwd is
            # `D:\a\whisper-dictate\whisper-dictate\` (33 chars) and
            # whisper.cpp's ExternalProject writes its cmake compiler probe
            # into
            #   .../target/release/build/whisper-rs-sys-<hash>/out/build/
            #     ggml/src/ggml-vulkan/vulkan-shaders-gen-prefix/src/
            #     vulkan-shaders-gen-build/CMakeFiles/CMakeScratch/
            #     TryCompile-<id>/CMakeFiles/cmTC_<id>.dir/testCCompiler.c.obj
            # which comes out at ~258 chars. cmake first prints a warning
            # at 246 chars ("has 246 characters. The maximum full path to
            # an object file is 250 characters (see CMAKE_OBJECT_PATH_MAX)"),
            # then cl.exe hits classic MAX_PATH while opening its /Fo
            # object file, truncates the output filename to empty, and
            # errors with the tell-tale
            #   fatal error C1083: Cannot open compiler generated file:
            #   '': Invalid argument
            # (rc.14 attempt-1 job 90252176432). OS long-path support
            # (HKLM\...\LongPathsEnabled=1, git core.longpaths, cl.exe's
            # .manifest longPathAware) does NOT rescue cl.exe here: cl.exe
            # writes /Fo through a plain CreateFile without a `\\?\`
            # prefix, so the 260-char ceiling still bites even when the
            # filesystem accepts longer paths. Moving the cargo target
            # root to `D:\t` (3 chars) shaves ~40 chars off every nested
            # cmake path and puts the probe safely under the cap. `D:\`
            # (not `C:\`) because GitHub-hosted windows-2025 runners
            # reserve the larger volume for the workspace at `D:\a\...`
            # -- writing whisper.cpp + vulkan-shaders-gen release
            # output onto the small `C:` OS volume would trade the C1083
            # bug for a "no space left on device" regression that's
            # harder to diagnose (Claude review on #670). See the
            # Copy-Item back to target\release\ below keeps downstream
            # Verify, ZIP, and Inno steps on the conventional path.
            $shortTargetDir = 'D:\t'
            $env:CARGO_TARGET_DIR = $shortTargetDir
            Write-Host "CARGO_TARGET_DIR = $env:CARGO_TARGET_DIR (short path to keep vulkan-shaders-gen TryCompile below Windows MAX_PATH)"
            Write-Host "Building whisper-dictate with Vulkan GPU acceleration for whisper.cpp"
            cargo build --manifest-path src/rust/Cargo.toml --target-dir $shortTargetDir --release -p whisper-dictate-app --bins @vulkanFeatureArgs
            if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
            $builtReleaseDir = Join-Path $shortTargetDir 'release'
            # Copy the release artefacts back to the conventional
            # target\release\ path so the Verify / Build Windows ZIP / Inno
            # steps below keep working without a per-branch fork. Use -Force
            # so a warm target\release\ from a previous attempt is overwritten.
            New-Item -ItemType Directory -Force target\release | Out-Null
            Copy-Item (Join-Path $shortTargetDir 'release\wd.exe')     target\release\ -Force
            Copy-Item (Join-Path $shortTargetDir 'release\wd-gui.exe') target\release\ -Force
          } else {
            Write-Host "VOICEPI_BUILD_VULKAN=0 - building whisper-dictate WITHOUT GPU acceleration (CPU-only fallback)"
            cargo build --manifest-path src/rust/Cargo.toml --target-dir target --release -p whisper-dictate-app --bins @cpuFeatureArgs
            if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
          }
          if ($legacyOnnxRequired) {
            $onnxDlls = @(Get-ChildItem -LiteralPath $builtReleaseDir -Filter 'onnxruntime*.dll' -File)
            if ($onnxDlls.Count -eq 0) {
              throw "Legacy audio-in-rust build did not emit its required ONNX Runtime DLL in $builtReleaseDir"
            }
            New-Item -ItemType Directory -Force target\release | Out-Null
            foreach ($dll in $onnxDlls) {
              $destination = Join-Path (Join-Path $PWD 'target\release') $dll.Name
              if ($dll.FullName -ne $destination) {
                Copy-Item -LiteralPath $dll.FullName -Destination $destination -Force
              }
            }
            Write-Host "Staged legacy ONNX Runtime sidecars: $($onnxDlls.Name -join ', ')"
          }

      # Regression guard for the Vulkan wiring (root cause of #645: the
      # Windows release binary shipped CPU-only, so `use gpu = 1` never
      # took effect on an NVIDIA RTX 3080 — 5+ min for a 3 s clip). Read
      # the built .exe as raw bytes and search for the whisper.cpp Vulkan
      # backend's compiled-in string constants ("ggml_vk", "GGML_VULKAN"
      # log line, or the SPIR-V "vulkan1.1" ID). Absence = whisper-rs was
      # linked without the `vulkan` feature, i.e. the CPU-only fallback
      # shipped. Skipped when the Vulkan feature was intentionally
      # disabled via `VOICEPI_BUILD_VULKAN=0`.
      - name: Verify whisper.cpp Vulkan backend is linked into the release binary
        if: steps.win-check.outputs.changed == 'true' && env.VOICEPI_BUILD_VULKAN != '0'
        shell: pwsh
        run: |
          $exe = "target\release\wd.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "release binary missing at $exe" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          # Convert once to ASCII string; whisper.cpp's Vulkan strings are
          # ASCII printable so a naive scan is enough (avoids pulling a
          # PE-parser dependency for a one-shot regression check).
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          # These tokens are compiled INTO the whisper.cpp Vulkan backend
          # (ggml/src/ggml-vulkan). Any one of them appearing proves the
          # backend was linked. Require at least one match.
          $tokens = @('ggml_vk_', 'ggml_vulkan', 'GGML_VULKAN', 'VkInstance')
          $hits = @()
          foreach ($t in $tokens) {
            if ($ascii.Contains($t)) { $hits += $t }
          }
          if ($hits.Count -eq 0) {
            throw "Vulkan backend is not linked into wd.exe: none of $($tokens -join ', ') found in the binary."
          }
          Write-Host "OK Vulkan backend linked - found tokens: $($hits -join ', ')"

      - name: Build installers
        if: steps.win-check.outputs.changed == 'true'
        shell: pwsh
        run: |
          $version = "${{ env.TAG }}" -replace '^v',''
          Set-Content VERSION $version -Encoding ascii
          # Inno Setup's VersionInfoVersion must be a numeric dotted version, so
          # strip any prerelease suffix (e.g. 1.9.5-rc.1 -> 1.9.5). AppVersion /
          # the output filename keep the full string incl. -rc.N.
          $versionInfo = $version -replace '-rc\.\d+$',''
          $iscc    = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $outDir  = "$PWD\Output"
          New-Item -ItemType Directory -Force $outDir | Out-Null
          & $iscc /DVERSION=$version /DVERSION_INFO=$versionInfo /O"$outDir" packaging\windows\inno\whisper-dictate.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          if ($env:LEGACY_ONNX_REQUIRED -eq 'true') {
            $installer = Join-Path $outDir "whisper-dictate-windows-setup-$version.exe"
            if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
              throw "Expected installer is missing: $installer"
            }
            $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
            if (-not $sevenZip) { throw '7z.exe is required to verify the legacy Inno payload' }
            $listing = (& $sevenZip l -slt $installer 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "7-Zip could not inspect the built installer: $installer" }
            if ($listing -notmatch '(?im)^Path = .*onnxruntime.*\.dll\s*$') {
              throw "Legacy Inno installer is missing its required ONNX Runtime sidecar: $installer"
            }
            Write-Host 'Verified ONNX Runtime sidecar inside the built Inno installer'
          }

      - name: Build Windows ZIP packages
        if: steps.win-check.outputs.changed == 'true'
        shell: pwsh
        run: |
          $version = "${{ env.TAG }}" -replace '^v',''
          $outDir = "$PWD\Output"
          $bundle = Join-Path $outDir "zip-windows\whisper-dictate"
          Remove-Item (Split-Path $bundle -Parent) -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $bundle | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $bundle "shared\config") | Out-Null
          Copy-Item shared\config\settings_schema.json (Join-Path $bundle "shared\config")
          Copy-Item README.md,LICENSE,VERSION $bundle
          Copy-Item docs $bundle -Recurse
          New-Item -ItemType Directory -Force (Join-Path $bundle "assets") | Out-Null
          Copy-Item assets\whisper-dictate.ico (Join-Path $bundle "assets")
          Copy-Item target\release\wd.exe $bundle
          # Sibling windows-subsystem binary — shipped alongside the CLI so
          # portable-zip users get the tray-launch UX (no cmd-window flash)
          # that the Inno installer's shortcuts already provide.
          Copy-Item target\release\wd-gui.exe $bundle
          $onnxDlls = @(Get-ChildItem -LiteralPath target\release -Filter 'onnxruntime*.dll' -File)
          if ($env:LEGACY_ONNX_REQUIRED -eq 'true' -and $onnxDlls.Count -eq 0) {
            throw 'Legacy installer requires ONNX Runtime, but no sidecar reached target\release'
          }
          foreach ($dll in $onnxDlls) {
            Copy-Item -LiteralPath $dll.FullName -Destination $bundle -Force
          }
          # Ship the golden-benchmark manifest (corpus.json only — NOT the
          # user-local, gitignored audio) so "Run benchmark" resolves a corpus
          # out of the box. Mirrors the Inno installer's benchmark\corpus.json.
          New-Item -ItemType Directory -Force (Join-Path $bundle "benchmark") | Out-Null
          Copy-Item benchmark\corpus.json (Join-Path $bundle "benchmark")
          $zip = Join-Path $outDir "whisper-dictate-windows-$version.zip"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path (Split-Path $bundle -Parent) "whisper-dictate") -DestinationPath $zip -CompressionLevel Optimal
          if ($env:LEGACY_ONNX_REQUIRED -eq 'true') {
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
            try {
              $hasOnnx = $archive.Entries | Where-Object { $_.Name -like 'onnxruntime*.dll' }
              if (-not $hasOnnx) { throw "Legacy ZIP is missing its required ONNX Runtime sidecar: $zip" }
            } finally {
              $archive.Dispose()
            }
          }

      - name: Compute SHA256 hashes
        if: steps.win-check.outputs.changed == 'true'
        shell: pwsh
        run: |
          $out = @()
          foreach ($f in Get-ChildItem "Output\*.exe", "Output\*.zip") {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$($f.Name)=$hash" | Tee-Object -Append sha256sums.txt
            $out += [pscustomobject]@{ File = $f.Name; SHA256 = $hash }
          }
          $out | ConvertTo-Json | Set-Content sha256sums.json -Encoding utf8
          Get-Content sha256sums.txt

      # Runs for BOTH finals and prereleases. An RC version (e.g. 1.9.5-rc.1) is a
      # valid NuGet/SemVer prerelease, so the resulting .nupkg is automatically a
      # prerelease package: `choco upgrade whisper-dictate` ignores it and
      # `choco upgrade whisper-dictate --prerelease` installs it. The version is
      # taken verbatim from the tag, so no prerelease-specific handling is needed.
      - name: Build Chocolatey package
        if: steps.win-check.outputs.changed == 'true'
        shell: pwsh
        run: |
          $version = "${{ env.TAG }}" -replace '^v',''
          $repo    = "${{ github.repository }}"
          $tag     = "${{ env.TAG }}"
          $hashes  = Get-Content sha256sums.json | ConvertFrom-Json
          $installerName = "whisper-dictate-windows-setup-$version.exe"
          $installerHash = ($hashes | Where-Object File -eq $installerName).SHA256
          if (-not $installerHash) { throw "Missing SHA256 for $installerName" }

          $baseUrl = "https://github.com/$repo/releases/download/$tag"
          $installerUrl = "$baseUrl/$installerName"
          $packageDir = "Output\chocolatey\whisper-dictate"
          Remove-Item $packageDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$packageDir\tools" | Out-Null
          Copy-Item packaging\windows\chocolatey\tools\*.ps1 "$packageDir\tools\"

          $nuspec = Get-Content packaging\windows\chocolatey\whisper-dictate.nuspec -Raw
          $nuspec = $nuspec.Replace('__VERSION__', $version)
          Set-Content "$packageDir\whisper-dictate.nuspec" $nuspec -Encoding utf8

          $install = Get-Content "$packageDir\tools\chocolateyinstall.ps1" -Raw
          $install = $install.Replace('__INSTALLER_URL__', $installerUrl)
          $install = $install.Replace('__INSTALLER_SHA256__', $installerHash)
          Set-Content "$packageDir\tools\chocolateyinstall.ps1" $install -Encoding utf8

          choco pack "$packageDir\whisper-dictate.nuspec" --outputdirectory Output
          if ($LASTEXITCODE -ne 0) { throw "choco pack failed" }

      # Fill the winget manifest templates with this release's version, installer
      # URL and SHA256, then ship the concrete manifests as a release asset. This
      # replaces the old manual "bump the winget manifests in a PR" step without
      # pushing to protected main — users install via `winget install --manifest`
      # against the extracted zip.
      #
      # Skipped on prerelease: winget is finals-only (no prerelease channel; we
      # don't auto-submit manifests anyway), so an RC ships no winget asset. The
      # Chocolatey pack/publish steps below still run — an RC .nupkg is a NuGet
      # prerelease by SemVer, installable only via `choco upgrade --prerelease`.
      - name: Generate winget manifests
        if: steps.win-check.outputs.changed == 'true' && inputs.is_prerelease != 'true'
        shell: pwsh
        run: |
          $version = "${{ env.TAG }}" -replace '^v',''
          $repo    = "${{ github.repository }}"
          $tag     = "${{ env.TAG }}"
          $hashes  = Get-Content sha256sums.json | ConvertFrom-Json
          $installerName = "whisper-dictate-windows-setup-$version.exe"
          $installerHash = ($hashes | Where-Object File -eq $installerName).SHA256
          if (-not $installerHash) { throw "Missing SHA256 for $installerName" }
          $installerUrl = "https://github.com/$repo/releases/download/$tag/$installerName"
          $releaseDate  = (Get-Date -Format 'yyyy-MM-dd')
          $outDir = "Output\winget"
          New-Item -ItemType Directory -Force $outDir | Out-Null
          foreach ($f in Get-ChildItem packaging\windows\winget\*.yaml) {
            # Drop template comment lines so the generated manifest is clean.
            $body = (Get-Content $f.FullName | Where-Object { $_ -notmatch '^\s*#' }) -join "`n"
            $body = $body.Replace('__VERSION__', $version).
              Replace('__INSTALLER_URL__', $installerUrl).
              Replace('__INSTALLER_SHA256__', $installerHash).
              Replace('__RELEASE_DATE__', $releaseDate)
            Set-Content (Join-Path $outDir $f.Name) $body -Encoding utf8
          }
          $zip = "Output\whisper-dictate-winget-$version.zip"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$outDir\*" -DestinationPath $zip
          Write-Host "Generated winget manifests for ${version}:"
          Get-ChildItem $outDir | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Stage Windows release artifacts
        if: steps.win-check.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-${{ inputs.tag }}
          path: |
            Output/*.exe
            Output/*.zip
            Output/*.nupkg
          if-no-files-found: error
          retention-days: 7

      # NOTE: winget manifests are generated from the packaging/windows/winget
      # templates in the "Generate winget manifests" step above and shipped as the
      # whisper-dictate-winget-<version>.zip release asset — NOT committed to main
      # (protected: PR + CI only, so CI must not push to it). Users install via
      # `winget install --manifest` against the extracted zip.
