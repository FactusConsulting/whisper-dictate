name: windows-installer

# Manual rebuild of the Windows installer for an existing release tag.
#
# This is a thin wrapper around the same staged build and publication workflows
# used by release.yml. The build artifact is created once, then uploaded to the
# existing release and package feeds.
#
# Use this to re-run the installer build against a tag that already has a GitHub
# Release (e.g. after fixing a build issue) without cutting a new tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Native Rust release tag to rebuild (v1.25.0 or newer)'
        required: true

jobs:
  build-installer:
    permissions:
      contents: read
    uses: ./.github/workflows/windows-installer-build.yml
    with:
      tag: ${{ github.event.inputs.tag }}
      # Manual rebuilds always build (force past the Windows-relevant-changes
      # gate). is_prerelease is derived from the input tag so an RC tag
      # rebuild (e.g. v1.19.0-rc.1) does NOT publish a winget manifest —
      # winget is finals-only per the project's release process. Final tags
      # (no `-rc.N` suffix) keep the historical 'false' behaviour and the
      # winget-generation step runs as before. P2 #406 Codex finding.
      force_build: true
      is_prerelease: ${{ contains(github.event.inputs.tag, '-rc.') && 'true' || 'false' }}

  publish-installer:
    needs: build-installer
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/windows-installer-publish.yml
    with:
      tag: ${{ github.event.inputs.tag }}
      upload_release_assets: true
    secrets:
      CHOCOLATEY_NUGET_SOURCE: ${{ secrets.CHOCOLATEY_NUGET_SOURCE }}
      CHOCOLATEY_NUGET_API_KEY: ${{ secrets.CHOCOLATEY_NUGET_API_KEY }}
