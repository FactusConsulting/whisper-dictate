name: cargo-audit

on:
  # PRs call this workflow from test.yml so the result can be aggregated into
  # the required `unit` context without starting a duplicate audit run.
  workflow_call:
    inputs:
      ref:
        description: Git ref to audit. Empty uses the triggering ref.
        type: string
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - "src/rust/Cargo.toml"
      - "src/rust/Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/cargo-audit.yml"
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  # A called workflow inherits github.workflow from its caller. Keep a literal
  # discriminator here so this job cannot share the caller's concurrency group
  # and cancel the tests workflow that is waiting for its result.
  group: ${{ github.workflow }}-cargo-audit-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Verify the lockfile is current
        run: cargo metadata --manifest-path src/rust/Cargo.toml --locked

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit --file src/rust/Cargo.lock
