name: cargo-audit

on:
  pull_request:
    paths:
      - "src/rust/Cargo.toml"
      - "src/rust/Cargo.lock"
      - ".github/workflows/cargo-audit.yml"
  push:
    branches: [main]
    paths:
      - "src/rust/Cargo.toml"
      - "src/rust/Cargo.lock"
      - ".github/workflows/cargo-audit.yml"
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Verify the lockfile is current
        run: cargo metadata --manifest-path src/rust/Cargo.toml --locked --no-deps

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit --config audit.toml --file src/rust/Cargo.lock
