[package]
name = "whisper-dictate-app"
version = "1.25.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/FactusConsulting/whisper-dictate"
# `cargo run` without `--bin` launches the canonical CLI.
default-run = "wd"

[lib]
path = "lib.rs"

[[bin]]
name = "wd"
path = "main.rs"

[[bin]]
name = "wd-gui"
path = "whisper-dictate-gui.rs"

# Renderer selection. These features gate the eframe renderer backend; `default`
# selects glow (our shipping renderer). Enabling both is allowed — ui.rs prefers
# wgpu when `ui-egui-wgpu` is on — but a normal build is glow. Build wgpu with
# `--no-default-features --features ui-egui-wgpu`. ui.rs picks the matching
# `eframe::Renderer` by cfg. The renderer-matrix CI workflow builds BOTH so the
# wgpu exit route never silently rots.
[features]
default = ["ui-egui-glow"]
ui-egui-glow = ["eframe/glow"]
ui-egui-wgpu = ["eframe/wgpu"]
# Local Whisper inference via the whisper.cpp bindings (`whisper-rs`).
# OFF in reduced developer builds; the `shipping` profile enables it. Enabling
# it pulls in whisper-rs and requires
# CMake and a C/C++ compiler (e.g. clang) on the build host, since
# whisper-rs compiles whisper.cpp from source. The module lives in
# `src/rust/whisper` and is wired into the native runtime.
# Note: `hound` (WAV decode) is an unconditional dep so the WAV helpers in
# `whisper::wav` compile and are unit-tested on every CI run without CMake.
whisper-rs-local = ["dep:whisper-rs"]
# Vulkan GPU acceleration for `whisper-rs-local` (Wave 7-C of #348). Pulls
# in whisper.cpp's Vulkan backend at compile time — works on Windows AND
# Linux from a single feature (vendor-agnostic, no NVIDIA-only CUDA DLLs).
# Requires the Vulkan SDK on the build host on top of the `whisper-rs-local`
# prerequisites. OFF by default; runtime selection is via `VOICEPI_WHISPER_GPU`
# (see `src/rust/whisper/gpu.rs`). On a build without this feature the env
# var still parses but the resolver in `should_use_gpu` always returns
# false, so users that set `VOICEPI_WHISPER_GPU=vulkan` on a stock binary
# silently fall back to CPU rather than refusing to run.
whisper-rs-vulkan = ["whisper-rs-local", "whisper-rs/vulkan"]
# VAD-free capture building block: cpal microphone capture + rubato resample,
# emitting raw 16 kHz frames. This is the push-to-talk capture path: the key
# press/release supplies recording boundaries. Device enumeration (`devices`)
# and the cpal capture self-test share this gate. This is the complete audio
# feature used by shipping builds.
# `dep:windows` is a cfg(windows)-only optional dep (DirectSound capture
# enumeration in devices.rs); on non-Windows targets enabling it is a no-op.
audio-capture = ["dep:cpal", "dep:rubato", "dep:crossbeam-channel", "dep:windows"]
# Rust-side PTT hotkey coordinator (issue #318). Owns the global
# key-event loop in Rust via `rdev` and serialises lifecycle events through a
# stage state machine so press/release races (#254, #274) become unrepresentable.
# Shipping builds include it; reduced developer builds can enable it alone
# with `--features rust-hotkeys`.
#
# `dep:evdev` is a Linux-only optional dep (declared under the
# `cfg(target_os = "linux")` target block below). On non-Linux targets the dep
# does not exist, so the feature activation is a no-op there — Windows / macOS
# builds with `--features rust-hotkeys` still get `rdev` only, and the
# evdev_driver module is `#[cfg(target_os = "linux")]` in `manager/mod.rs`.
rust-hotkeys = ["dep:rdev", "dep:evdev"]
# Phase 2.1 Rust-side keyboard injection (issue #348 sub-task 2.1). Pulls in
# `enigo` as a cross-platform direct-injection baseline (SendInput on Windows,
# CGEventTap on macOS, xdotest on Linux/X11). Linux Wayland still uses the
# helper fallback chain (kwtype/wtype/dotool/ydotool) which is dep-free.
# Shipping builds include the native injection backend; reduced developer
# builds can enable it alone with `--features rust-injection`.
rust-injection = ["dep:enigo", "dep:arboard"]
# Canonical feature profile for every supported CPU shipping artifact. Keep the
# complete runtime surface in one place so CI, release workflows, installers,
# Nix and developer commands cannot silently drift onto different backends.
shipping = [
  "ui-egui-glow",
  "rust-injection",
  "rust-hotkeys",
  "audio-capture",
  "whisper-rs-local",
]
# Windows release artifacts normally add whisper.cpp's Vulkan backend. This
# named profile is also the single compile/link contract used by the installer
# and its backend assertion.
shipping-vulkan = ["shipping", "whisper-rs-vulkan"]

[dependencies]
anyhow = "1.0"
# Unicode default case-folding (full C+F mappings — `ß → ss`, `İ → i\u{307}`,
# ligatures, etc.). Used by `benchmark::scoring` to keep WER/CER/term-match
# behaviour bit-identical to Python's `str.casefold()` (the corpus side of
# the port).
caseless = "0.2"
clap = { version = "4.5", features = ["derive"] }
# ctrlc: cross-platform SIGINT / Ctrl-C handler used by the `dictate-run` CLI
# verb (audit item 5 Phase A step 1) to shut the in-process dictation runtime
# down cleanly when the operator (or a supervising Python parent) hits Ctrl-C.
# Tiny, no transitive deps of note, and unconditional so the CLI surface
# compiles on every build — the handler itself is only registered when the
# subcommand runs.
ctrlc = "3.4"
# eframe 0.34 flipped its DEFAULT renderer from glow (OpenGL) to wgpu. We ship on
# glow and keep wgpu as a continuously-validated exit route, so the renderer is
# chosen by OUR features (see [features] below) rather than eframe's default:
# `default-features = false` drops eframe's renderer default, the common
# (non-renderer) features stay always-on here, and exactly one of
# `ui-egui-glow` / `ui-egui-wgpu` turns on `eframe/glow` / `eframe/wgpu`.
# Default build = glow; wgpu is opt-in via
# `--no-default-features --features ui-egui-wgpu` and is exercised by the
# periodic renderer-matrix CI workflow.
# eframe and egui_material_icons must move together because both expose egui
# types at the initialize call below. eframe 0.36 and icons 0.8 both use egui
# 0.36, avoiding incompatible egui::Context values in the GUI startup path.
eframe = { version = "0.36", default-features = false, features = [
  "accesskit",
  "default_fonts",
  "wayland",
  "x11",
] }
egui_material_icons = "0.8.0"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# SHA-256 integrity check on downloaded whisper.cpp GGML models
# (`whisper::model_manager`). Already a transitive dep of `keyring-core` /
# `eframe` on most platforms, so the direct pin doesn't grow the dep graph.
sha2 = "0.11"
thiserror = "2.0"
keyring-core = "1.0"
# `platform-verifier` lets the TLS layer validate certs against the OS trust
# store (rustls-platform-verifier) instead of ureq's bundled webpki-roots, so
# cloud endpoints behind a private/enterprise CA trusted through the platform
# store work from Rust the same way Python's urllib path did. Wired via
# `cloud_api::http::platform_tls_agent`.
ureq = { version = "3.3", features = ["json", "platform-verifier"] }
# hound: pure-Rust WAV reader/writer, used by `whisper::wav` for 16 kHz mono
# decoding. Unconditional so the WAV helpers are always available and covered.
hound = "3.5"
# Optional deps for the `whisper-rs-local` feature. `dep:` syntax in
# [features] keeps them out of the default build entirely.
# `raw-api` is a re-export-only feature (it compiles no extra code): it
# surfaces `whisper_rs::whisper_rs_sys` so `whisper::local::log_tap` can
# name the `ggml_log_level` FFI type its log callback must accept. Without
# it there is no way to spell the callback signature `whisper_log_set`
# requires, and therefore no way to observe whether whisper.cpp actually
# initialised a GPU backend.
whisper-rs = { version = "0.16", optional = true, features = ["raw-api"] }

# --- audio-capture feature deps (all OPTIONAL; not pulled in for default builds)
# cpal: cross-platform microphone capture (WASAPI on Windows, ALSA on Linux).
# rubato: fixed-frame FFT resampler (input chunk size → fixed output frame).
cpal = { version = "0.18", optional = true }
# rubato 4's unified Fft API provides the fixed-input streaming resampler.
# Input/output Vecs are wrapped with its re-exported audioadapter buffers.
rubato = { version = "5.0", optional = true }
# Fixed-capacity, non-blocking queues between the real-time callback,
# resampler, and session pump. Already present transitively via eframe; listed
# directly because the audio pipeline uses its try-send/try-receive contract.
crossbeam-channel = { version = "0.5", optional = true }

# --- rust-hotkeys feature dep (OPTIONAL; not pulled in for default builds)
# rdev: cross-platform global key event listener (X11 / Windows / macOS via the
# accessibility API). The native handles are not Send, so the manager thread
# owns the listen() call and exposes a Send-friendly mpsc API to the rest of
# the runtime — see src/rust/hotkey/manager.rs.
rdev = { version = "0.5", optional = true }

# Linux-only optional deps for the `rust-hotkeys` feature. Declared under the
# linux target block so a Windows / macOS build with `--features rust-hotkeys`
# never tries to compile `evdev` (which is Linux-kernel-specific).

# --- rust-injection feature dep (OPTIONAL; not pulled in for default builds)
# enigo: cross-platform synthetic-input. We use it for Windows (SendInput) and
# macOS (CGEventTap); Linux X11 also works out of the box, but the Wayland
# helper chain (kwtype/wtype/dotool/ydotool) is dep-free and lives in
# src/rust/injection/fallback.rs. Send/Sync constraints are handled inside the
# dispatcher (each inject_text call constructs a fresh Enigo).
enigo = { version = "0.6", optional = true }
# arboard supplies the real system clipboard used by native paste/Windows auto.
arboard = { version = "3.6", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0", features = ["crypto-rust"] }
# evdev: direct `/dev/input` keyboard listener for the `rust-hotkeys` feature on
# Linux. `rdev` only speaks X11 (XRecord), which cannot observe global key
# events on Wayland — so on GNOME/KDE Wayland the rdev listener is deaf and
# push-to-talk chords never fire. `evdev` reads the kernel input devices
# directly (needs the user in the `input` group), which works identically on
# X11 and Wayland; the deleted Python backend used evdev for exactly this
# reason. Optional + Linux-only; the `rust-hotkeys` feature enables it via
# `dep:evdev` (a no-op on non-Linux targets where this dep does not exist).
# The driver is selected at runtime by `manager::spawn` — evdev on Wayland,
# rdev on X11 — with `VOICEPI_HOTKEY_DRIVER=auto|rdev|evdev` as the override.
evdev = { version = "0.13", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

# Windows-only system-tray icon (notification area). Scoped to the Windows
# target so the Linux/CI build never pulls in tray-icon's gtk/libxdo system
# deps (its default features). On Windows it integrates with the winit/win32
# event loop that eframe already pumps. The pure state→colour and RGBA logic
# in `ui::tray` is cfg-free so its unit tests run on every platform.
[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.24", default-features = false }
windows-native-keyring-store = "1.1"
# Windows API bindings for the parallel WH_KEYBOARD_LL hook used by the
# hotkey diagnostic module (`hotkey::win_raw_hook`). Small feature set
# (`Win32_UI_WindowsAndMessaging` + `Win32_Foundation`) — only the LL
# hook installer, the message pump, and the hook-callback struct types.
# Unconditional on Windows (not feature-gated) because the hook is
# installed lazily at runtime under the `VOICEPI_LOG=trace`
# gate; a diagnostic that requires a rebuild to enable would defeat
# the whole point of the tee-file investigation workflow.
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_System_DataExchange"] }
# DirectSound capture enumeration for the mic picker (devices.rs). cpal on
# Windows is WASAPI-only, but the sounddevice picker deliberately surfaces
# DirectSound-only inputs (freshly docked/hot-plugged USB mics visible on
# DirectSound before WASAPI). We enumerate those via DirectSoundCaptureEnumerateW
# and merge them into the Rust device list so the Rust picker reaches parity
# with sounddevice before the default flip. `windows` is already in the tree
# (cpal uses it for WASAPI); this only adds the DirectSound + Foundation
# features. OPTIONAL + pulled in by `audio-capture` (the only feature that
# compiles devices.rs) so a stock build without audio does not activate these
# features — same feature-boundary discipline as the other optional audio deps.
windows = { version = "0.62", features = ["Win32_Media_Audio_DirectSound", "Win32_Media_Audio", "Win32_Foundation", "Win32_System_Com"], optional = true }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3.14"
# The Windows hidden-viewport smoke opts winit's test-process event loop into
# running on the Rust test thread. eframe already ships this exact dependency;
# declaring it here only exposes the platform extension trait to the test.
winit = { version = "0.30", default-features = false }
# Console-output ASCII guard (see console_ascii_tests.rs). Uses the REAL Rust
# lexer rather than a hand-rolled one: raw strings with any hash count, byte
# and C strings, nested block comments and unicode escapes are all handled by
# construction. Both crates are already in the lock file transitively, so this
# adds no new download. `span-locations` gives line numbers for the report.
proc-macro2 = { version = "1.0", features = ["span-locations"] }
litrs = "1.0"

# Windows intermittently denies rustc access while finalizing incremental cache
# directories, which turns clean builds/tests into noisy warnings. Full rebuilds
# are a bit slower, but deterministic logs are more useful for this desktop app.
[profile.dev]
incremental = false

[profile.test]
incremental = false
