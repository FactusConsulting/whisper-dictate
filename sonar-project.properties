sonar.projectKey=FactusConsulting_whisper-dictate
sonar.organization=factusconsulting

# Keep sources and tests disjoint — a path in both lists makes the scanner fail
# with "can't be indexed twice" (the test dirs live under src/). The Rust crate
# is now flat under src/rust, so its integration tests (src/rust/tests) sit
# inside the source root and are carved back out via sonar.exclusions below.
sonar.sources=src/rust,scripts,packaging,nix
sonar.tests=src/rust/tests
sonar.rust.cargo.manifestPaths=src/rust/Cargo.toml
# Rust analysis runs as CI-based analysis (Rust is not eligible for SonarCloud
# Automatic Analysis). Import Clippy lints from the JSON report produced in
# sonar.yml instead of letting the analyzer re-run Clippy (avoids duplicates).
sonar.rust.clippy.enabled=false
sonar.rust.clippyReport.reportPaths=clippy-report.json

# Coverage is generated in sonar.yml with repo-root-relative source paths.
sonar.rust.lcov.reportPaths=lcov.info

sonar.exclusions=target/**,Output/**,__pycache__/**,.venv*/**,.codex-test-venv/**,*.egg-info/**,src/rust/tests/**

# Structurally repetitive by design, so copy-paste detection only produces
# false positives:
#   - text.rs: the localized-string catalogue (one match arm per key/language)
#   - benchmark_results.rs: per-status row mapping + many near-identical parse
#     test fixtures; tabs/benchmark_results.rs: per-row egui table cells.
#   - corpus_record.rs: same localized-string-catalogue shape as text.rs — the
#     english()/danish() methods each map every CorpusRecordText variant to its
#     string (one arm per key/language), not unit-testable logic.
#   - test_support.rs: the hermetic `test_app` builder lists every
#     WhisperDictateApp field, mirroring the `Default` struct literal in ui.rs.
#     It deliberately cannot reuse `Default::default()` (that does real config
#     I/O, keyring access and a GPU probe); the full-field literal is inherent.
#   - hotkey_supervisor_tests.rs / worker_command_tests.rs: runtime supervisor
#     unit tests. Each test independently acquires ENV_LOCK + sets up
#     EnvVarGuard stubs — this boilerplate repeats across every test because
#     Rust has no test-fixture support; the repetition is structural, not
#     accidental copy-paste.
#   - session/tests_transitions.rs: the DictateSession state-transition unit
#     tests. Same structural repetition as the other *_tests.rs above — each
#     test independently builds a session (`session(...)` + optional
#     `with_dictionary(Dictionary { terms, replacements })`), drives one
#     utterance, and asserts on the injected text / worker-event payload.
#     Rust has no test-fixture support, so that arrange-act scaffolding
#     necessarily repeats verbatim across the dictionary/format/inject cases;
#     spelling each case out (distinct transcript + replacement literals) keeps
#     the tests self-documenting, so the repetition is structural, not
#     accidental copy-paste.
#   - session/tests_history_sink.rs + tests_metrics_sink.rs: parallel sink
#     wiring tests. Each defines a `CapturingSink` + `SharedSink(Arc<...>)`
#     helper for its own trait (HistorySink vs MetricsSink), which Sonar
#     flags as cross-file duplication. The two traits + payload filters are
#     genuinely different (history filters, metrics writes raw) — the
#     duplication is only in the test scaffolding (mutex/refcell capture,
#     Arc-shared handle for snapshot), which Rust's lack of generic mock
#     fixtures forces to repeat. Extracting a shared generic helper would
#     obscure which trait each test exercises, so the repetition is left
#     structural.
#   - session/history_sink.rs + metrics_sink.rs: parallel production
#     modules — each ships an `effective_*_settings` env-overlay helper
#     and a `Reloading*Sink` wrapper of near-identical shape. Extracting
#     shared logic would obscure per-sink behaviour.
#   - session/tests_profile.rs + backends/whisper_local_tests.rs +
#     runtime/rust_session_{inject,real_backends}_tests.rs: parallel
#     per-profile-override wiring tests. Each block wraps one override
#     key (initial_prompt / lang / inject_mode / post_*) in the same
#     "build session -> attach profile -> drive -> assert" arc. Same
#     rationale as the sink tests above.
#   - backends/cloud_transcribe.rs + whisper_local.rs: parallel
#     production backends both implementing TranscribeBackend with the
#     same per-profile-key override plumbing (initial_prompt, language,
#     model). Cloud vs local paths differ but the override-mapping
#     scaffolding is intentionally symmetric so a new backend can copy
#     the same pattern.
#   - hotkey/manager/rdev_driver.rs + hotkey/modifier_match.rs: the
#     PTT key-name catalogue is deliberately maintained as parallel
#     lookup tables that each expose a different projection —
#     `RDEV_SUPPORTED_NAMES` is the install-time allow-list,
#     `modifier_family` maps names to their family token,
#     `canonical_side` picks the canonical side-alias, and
#     `is_generic_modifier` gates the "sideless press satisfies a
#     sided binding" fallback. Extracting them into a single
#     `(name, family, side, generic)` table would work but hides the
#     per-column intent (each accessor is called on a hot path with
#     different call sites and different assumptions about what
#     counts as membership). The Codex P2 #656 aliases sweep
#     (`alt_r` / `win` / `win_l` / `win_r`) touched every table with
#     the same handful of names, tripping the CPD copy-paste
#     detector even though the columns themselves are semantically
#     distinct. Excluded here so the intentional parallelism does
#     not drag the new-code duplication gate.
#   - hotkey/manager/rdev_driver_tests.rs + hotkey/manager/tracker_tests.rs
#     + hotkey/manager/win_registerhotkey_tests.rs: unit-test
#     enumerations of the same PTT-name set (one test per redaction
#     surface, one per validator, one per parser). Same
#     structural-parallelism rationale as the *_tests.rs files above.
#   - runtime/cloud_api_keys_tests.rs + postprocess/endpoint_marker_tests.rs
#     + postprocess/run_tests.rs: Codex #642 + #666 P1 endpoint-marker
#     regression suite. Each scenario (post-key stamp, STT-fallback stamp,
#     UI-shim stamp, scheme downgrade, custom-origin change, per-provider
#     mismatch, trailing-slash strip) independently arranges its own
#     command/settings + captures the outgoing header, because each is
#     asserting on a DIFFERENT security invariant and the arrangement is
#     part of what documents which leak the test guards. Extracting the
#     `default_worker_command() + push key + call shim` scaffolding into a
#     shared helper would erase the per-test intent (the leak channel each
#     one covers) and make the security tests harder to audit. Same
#     "arrange-act boilerplate repeats because Rust has no test-fixture
#     support" rationale as the other *_tests.rs entries above.
sonar.cpd.exclusions=src/rust/ui/text.rs,src/rust/ui/benchmark_results.rs,src/rust/ui/tabs/benchmark_results.rs,src/rust/ui/corpus_record.rs,src/rust/ui/test_support.rs,src/rust/runtime/hotkey_supervisor_tests.rs,src/rust/runtime/worker_command_tests.rs,src/rust/whisper/model_manager_tests.rs,src/rust/whisper/wav_tests.rs,src/rust/whisper/local/local_tests.rs,src/rust/dictate/session/tests_transitions.rs,src/rust/dictate/session/tests_history_sink.rs,src/rust/dictate/session/tests_metrics_sink.rs,src/rust/dictate/session/preview/tests.rs,src/rust/runtime/rust_session_preview_tests.rs,src/rust/dictate/session/history_sink.rs,src/rust/dictate/session/metrics_sink.rs,src/rust/dictate/session/tests_profile.rs,src/rust/dictate/backends/whisper_local_tests.rs,src/rust/runtime/rust_session_inject_tests.rs,src/rust/runtime/rust_session_real_backends_tests.rs,src/rust/dictate/backends/cloud_transcribe.rs,src/rust/dictate/backends/whisper_local.rs,src/rust/hotkey/manager/rdev_driver.rs,src/rust/hotkey/modifier_match.rs,src/rust/hotkey/manager/rdev_driver_tests.rs,src/rust/hotkey/manager/tracker_tests.rs,src/rust/hotkey/manager/win_registerhotkey_tests.rs,src/rust/runtime/cloud_api_keys_tests.rs,src/rust/postprocess/endpoint_marker_tests.rs,src/rust/postprocess/run_tests.rs

# Coverage exclusions: code whose uncovered remainder is genuinely OS/IO/UI
# integration, not unit-testable business logic (the pure logic these wrap is
# covered by existing tests, e.g. api_key_env_tests / settings_reset_tests).
# Still analysed for bugs/smells/security — just not counted in coverage:
#   - egui immediate-mode UI rendering (tabs, widgets, previews, log, app, ui root)
#   - OS credential store / keyring (api_keys, secret_store)
#   - cloud STT / post-processing HTTP client (`src/rust/cloud_api/**`): real
#     network requests to remote APIs (chat.rs, check.rs, http.rs, transcribe.rs
#     under the cloud_api/ module), not unit-testable without a live/mock
#     server; the pure status/error formatting it wraps is exercised indirectly.
#     (The old single-file `src/rust/cloud_api.rs` was split into the module
#     directory in Wave 4-B (#356); only the dir glob is needed now.)
#   - config-IO + credential-persistence app state (settings_state)
#   - background task / subprocess orchestration (tasks)
#   - process entrypoints (`main.rs` and GUI launchers): they hand off to
#     covered library code but cannot run in a unit test without starting a
#     desktop UI. CLI integration tests cover the command contract.
#   - device/event hotkey loops + the Rust subprocess bridge (vp_keys, vp_rust)
#   - dictation event loop + audio/transcribe/inject pipeline (runtime, vp_dictate)
#   - developer/benchmark scripts
#   - egui palette/style/chrome painting (theme)
#   - localized-string catalogue (text.rs): pure data, one match arm per
#     (key, language) pair — not unit-testable logic (also cpd-excluded above)
#   - `models` CLI handler (whisper/models_cli.rs): a thin dispatcher around
#     `model_manager` plus the carriage-return stderr progress sink — same
#     "HTTP wrapper + terminal IO" shape as `cloud_api`. The pure formatting
#     helpers (`human_bytes`, `print_list`) keep their unit tests for
#     behaviour assertions; the coverage metric just doesn't count them so
#     the dispatcher's untestable terminal-IO branches don't drag the gate.
#   - rdev OS listener (hotkey/manager/rdev_driver.rs): the blocking
#     `rdev::listen` global key-event loop; requires a real OS display /
#     accessibility permission that headless CI containers never have. The
#     pure coordinator and tracker layers it wraps are unit-tested
#     independently (coordinator/tests.rs, manager/tracker.rs).
#   - whisper.cpp FFI inference (whisper/local/mod.rs): whisper-rs-local feature
#     gate requires CMake + C++ toolchain; the standard Sonar build omits this
#     feature so the file never appears in LCOV. Excluded so coverage-metric
#     new-code counts stay clean if the scanner ever sees the absent file.
#   - whisper.cpp log tap (whisper/local/log_tap.rs): same feature gate, and
#     the file is a bare `extern "C"` callback whose body only runs when
#     whisper.cpp invokes it during a real model load. The classification it
#     feeds is a pure function in `whisper/accel.rs` and IS unit-tested (that
#     file is deliberately NOT excluded), so the exclusion hides only the FFI
#     trampoline, not the logic.
#   - JSON-over-stdio dispatcher (whisper/dispatch.rs): same feature gate as
#     local/mod.rs (whisper-rs-local). The pure helpers it wraps — JSON parsing,
#     normalise_language / normalise_prompt — have their own tests wired in the
#     same file and compiled under the feature; excluded to keep the gate clean.
#   - code behind cargo features the Sonar build does not enable:
#     `audio/self_test/**` (the whole `audio` module is `#[cfg(feature =
#     "audio-capture")]`) and `hotkey/manager/evdev_driver.rs` (`#[cfg(all(
#     feature = "rust-hotkeys", target_os = "linux"))]`). NOT
#     `hotkey/self_test.rs`: only its `imp` runner is feature-gated, while
#     driver parsing, report rendering and the stock stub compile
#     unconditionally and have default-build tests -- excluding it would
#     discard real coverage (caught in review of #576). Same rationale as local/mod.rs and
#     dispatch.rs below: the Sonar build runs --features ui-egui-glow, so
#     these files never appear in LCOV at all and their lines would count as
#     permanently uncovered. They ARE tested -- `cargo test --features
#     audio-capture` exercises the report renderers, including the
#     failure-path assertions added alongside this exclusion.
#   - Rust runtime supervisor (src/rust/runtime/**): native start/stop/restart,
#     OS hotkey ownership, model/audio backend construction, and teardown are
#     integration-heavy. The pure parsing and lifecycle seams keep focused unit
#     tests, while feature-gated integration tests cover the native session.
#   - injection/wayland.rs: subprocess helper shims for ydotool /
#     kwtype / wtype / dotool. Every function shells to an external
#     binary and reads its exit code / stderr; unit tests can't spawn
#     those without a real Wayland session. Pure error-classification
#     helpers stay inline-tested via the dispatcher.
#   - hotkey/capture.rs + hotkey/coordinator/mod.rs: `hotkey capture`
#     CLI verb + coordinator loop that owns the rdev/evdev event stream.
#     Both live behind the `rust-hotkeys` feature and the Sonar build
#     runs `--features ui-egui-glow` only, so their production paths
#     never appear in LCOV. Feature-gated tests exercise them via
#     `cargo test --features rust-hotkeys`. Same exclusion rationale
#     as `evdev_driver.rs` / `rdev_driver.rs` above.
#   - corpus_record_native.rs: microphone-driven cpal capture path (uses
#     `crate::audio::capture::start_capture`). Uncovered branches all
#     require a real mic on the runner. The pure-logic sibling
#     `corpus_record.rs` (id safety, duration heuristic, feature dispatcher)
#     is NOT excluded — it has 11 unit tests covering both `is_safe_corpus_id`
#     and `compute_record_seconds`, and Codex P2 #624 flagged that hiding
#     the whole module would let a future change delete those tests without
#     tripping the Sonar gate. The 3-line dispatcher is the only untestable
#     seam and is small enough to leave in-file.
#   - native injection adapters and visible-window activation: these are thin
#     OS/clipboard bridges around the pure dispatch and matching logic. They
#     require enigo, arboard, xdotool, or Win32 state that the headless Sonar
#     runner cannot exercise reliably; the pure seams remain covered.
sonar.coverage.exclusions=src/rust/audio/self_test/**,src/rust/hotkey/manager/evdev_driver.rs,src/rust/ui/tabs/**,src/rust/ui/theme.rs,src/rust/ui/widgets.rs,src/rust/ui/widgets_combo.rs,src/rust/ui/previews.rs,src/rust/ui/log_render.rs,src/rust/ui/text.rs,src/rust/ui/app.rs,src/rust/ui.rs,src/rust/ui/api_keys.rs,src/rust/ui/secret_store.rs,src/rust/ui/settings_state.rs,src/rust/ui/tasks.rs,src/rust/cloud_api/**,src/rust/postprocess/run.rs,src/rust/main.rs,src/rust/whisper-dictate-gui.rs,scripts/dev/**,scripts/benchmark/**,src/rust/runtime/**,src/rust/whisper/models_cli.rs,src/rust/hotkey/manager/rdev_driver.rs,src/rust/whisper/local/mod.rs,src/rust/whisper/local/log_tap.rs,src/rust/whisper/dispatch.rs,src/rust/dictate/simulate.rs,src/rust/injection/wayland.rs,src/rust/injection/ui.rs,src/rust/injection/enigo_backend.rs,src/rust/injection/mod.rs,src/rust/platform/window_enumeration.rs,src/rust/corpus_record_native.rs,src/rust/benchmark/native.rs,src/rust/benchmark/mod.rs,src/rust/hotkey/capture.rs,src/rust/hotkey/coordinator/mod.rs,src/rust/hotkey/mod.rs,src/rust/ui/corpus_record_tasks.rs,src/rust/hotkey/manager/win_raw_hook.rs,src/rust/hotkey/manager/tracker.rs,src/rust/diag.rs

# False positive: sanitize_dictionary_path() validates + resolves the path
# (rejects .., requires .json suffix). Sonar's taint analysis doesn't
# recognize the custom sanitizer. Local CLI, no HTTP boundary.
#
# S8705 and S8707 target LLM-agent systems where CLI args cross a sandbox
# boundary. This is a desktop dictation CLI with no LLM/sandbox context —
# rules don't apply.
